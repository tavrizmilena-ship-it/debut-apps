<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Doorway Game — What Did You Leave Behind?</title>
<meta name="description" content="An interactive memory adventure by DÉBUT Community.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#21150F; --choc:#342016; --burg:#642B32; --wine:#783A3D;
  --cream:#F2E7D5; --beige:#D7C4A8; --gold:#B28A58;
  --teal:#5E8C82; --grey:#8a7f74;
  --line:rgba(215,196,168,.22);
  --serif:'Cormorant Garamond', 'Playfair Display', Georgia, serif;
  --sans:'Manrope', 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
  --ease:cubic-bezier(.6,.05,.25,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--espresso);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--gold)}
::selection{background:var(--wine);color:var(--cream)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;justify-content:space-between;
  padding:12px clamp(16px,4vw,36px);background:linear-gradient(var(--espresso) 60%,rgba(33,21,15,0));}
.brand{font-family:var(--sans);font-size:12px;letter-spacing:.42em;font-weight:600;color:var(--cream);text-transform:uppercase;white-space:nowrap}
.progress{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.progress .lbl{font-size:10px;letter-spacing:.28em;color:var(--beige);text-transform:uppercase;white-space:nowrap}
.steps{display:flex;align-items:center;gap:6px}
.step{font-size:10.5px;letter-spacing:.14em;font-weight:600;color:rgba(215,196,168,.42);white-space:nowrap;transition:color .6s}
.step.cur{color:var(--cream)}
.step.done{color:var(--gold)}
.steps .bar{width:22px;height:1px;background:var(--line);position:relative;overflow:hidden}
.steps .bar i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.steps .bar.done i{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:10px}
.pts{font-size:10.5px;letter-spacing:.16em;color:var(--beige);border:1px solid var(--line);padding:7px 11px;border-radius:999px;white-space:nowrap}
.pts b{color:var(--cream);font-weight:700}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--cream);display:grid;place-items:center;cursor:pointer;transition:background .25s,border-color .25s}
.iconbtn:hover{background:rgba(178,138,88,.14);border-color:var(--gold)}
.iconbtn svg{width:18px;height:18px}
.hide{display:none!important}

/* ---------- layout ---------- */
#app{transition:opacity .45s ease;}
#app.out{opacity:0}
.wrap{max-width:1200px;margin:0 auto;padding:clamp(18px,4vw,40px) clamp(18px,4vw,36px) 64px}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:14px}
.eyebrow::after{content:"";height:1px;background:var(--line);flex:0 1 120px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.02;letter-spacing:.005em}
h1{font-size:clamp(46px,8vw,92px)}
h2{font-size:clamp(36px,5.6vw,64px);margin-top:10px}
h3{font-size:clamp(24px,3vw,32px)}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(22px,3vw,32px);color:var(--beige)}
p{line-height:1.7;margin:0 0 14px;font-size:16.5px;color:rgba(242,231,213,.9)}
.lead{font-size:18px}
.hr{height:1px;background:var(--line);margin:26px 0;border:0}
.muted{color:var(--beige)}
.small{font-size:13.5px}
.kicker{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--beige);font-weight:600}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1px solid var(--wine);background:var(--burg);color:var(--cream);font-family:var(--sans);
  text-transform:uppercase;letter-spacing:.2em;font-size:12.5px;font-weight:600;padding:17px 26px;min-height:52px;cursor:pointer;
  transition:background .25s,transform .15s,border-color .25s,opacity .25s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:2px}
.btn:hover{background:var(--wine);border-color:var(--gold)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.38;cursor:not-allowed;background:var(--choc);border-color:var(--line)}
.btn.ghost{background:transparent;border-color:rgba(215,196,168,.4)}
.btn.ghost:hover{background:rgba(178,138,88,.12);border-color:var(--gold)}
.btn.link{background:none;border:0;padding:10px 0;min-height:44px;color:var(--beige);letter-spacing:.18em;font-size:11.5px;text-decoration:underline;text-underline-offset:6px;text-decoration-color:rgba(178,138,88,.6)}
.btn.link:hover{color:var(--cream);background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:26px}
.back{margin-bottom:8px}

/* ---------- panels / chips ---------- */
.panel{background:linear-gradient(180deg,rgba(100,43,50,.24),rgba(52,32,22,.5));border:1px solid var(--line);padding:clamp(20px,3vw,32px);border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;border:1px solid rgba(215,196,168,.35);background:rgba(33,21,15,.55);color:var(--cream);padding:12px 16px;min-height:46px;font-size:14.5px;cursor:pointer;border-radius:2px;display:inline-flex;align-items:center;gap:10px;transition:border-color .2s,background .2s}
.chip svg{width:26px;height:26px;color:var(--gold);flex:none}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--burg);border-color:var(--gold)}
.counter{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--beige);font-weight:600;margin:18px 0 0}
.counter b{color:var(--cream)}
.note{font-size:14px;color:var(--beige);border-left:2px solid var(--gold);padding:6px 0 6px 14px;margin-top:16px}

/* cards grid (ingredients/travel/final) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{appearance:none;position:relative;border:1px solid rgba(215,196,168,.28);background:rgba(33,21,15,.6);color:var(--cream);padding:18px 12px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:2px;transition:border-color .2s,background .2s,transform .2s;min-height:128px;text-align:center;font-size:14.5px}
.card svg.ic{width:52px;height:52px;color:var(--gold)}
.card:hover{border-color:var(--gold)}
.card[aria-pressed="true"]{border:1px solid var(--wine);box-shadow:inset 0 0 0 2px var(--wine);background:rgba(100,43,50,.35)}
.card .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--wine);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.2s}
.card .tick svg{width:13px;height:13px}
.card[aria-pressed="true"] .tick{opacity:1;transform:none}
.card[disabled]{cursor:default}
.card.r-correct{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal);background:rgba(94,140,130,.16)}
.card.r-wrong{border-color:var(--wine);box-shadow:inset 0 0 0 2px var(--wine);background:rgba(100,43,50,.35)}
.card.r-missed{border-color:rgba(138,127,116,.6);opacity:.62;background:rgba(80,72,64,.18)}
.card.r-missed svg.ic{color:var(--grey)}
.card.r-ok{opacity:.4}
.card .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.r-correct .tag{color:#8fc0b4}.r-wrong .tag{color:#d58b90}.r-missed .tag{color:var(--grey)}

/* ---------- cover ---------- */
.cover{min-height:calc(100vh - 62px);display:grid;grid-template-columns:1.05fr .95fr;max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,36px) 40px;gap:clamp(24px,5vw,72px);align-items:center}
.cover .txt{padding:20px 0}
.cover h1{margin:22px 0 10px}
.cover .tagline{font-size:11.5px;letter-spacing:.36em;color:var(--beige);margin-top:26px;text-transform:uppercase}
.cover .actions{margin-top:38px}
.coverimg{position:relative;height:min(78vh,760px);overflow:hidden;border:1px solid var(--line)}
.coverimg img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;transform-origin:72% 52%;transition:transform 2.2s cubic-bezier(.5,0,.2,1),filter 2.2s}
.coverimg .glow{position:absolute;inset:0;background:radial-gradient(circle at 72% 52%,rgba(255,214,150,.95),rgba(232,170,90,.35) 22%,rgba(0,0,0,0) 48%);opacity:0;transition:opacity 1.8s ease .3s;mix-blend-mode:screen}
.coverimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(33,21,15,.35),transparent 40%)}
.coverimg.go img{transform:scale(2.6) translateX(-2%)}
.coverimg.go .glow{opacity:1}
.whiteout{position:fixed;inset:0;background:radial-gradient(circle at 60% 50%,#f6d9a8,#c79659 60%,#21150F);opacity:0;pointer-events:none;z-index:60;transition:opacity .9s ease}
.whiteout.on{opacity:1}

/* ---------- intro ---------- */
.intro{display:grid;grid-template-columns:1fr minmax(0,560px) 1fr}
.intro > *{grid-column:2}
.intro .challenge{margin-top:30px}
.intro strong{color:var(--cream);font-weight:700}

/* ---------- hall ---------- */
.hall{position:relative;border:1px solid var(--line);overflow:hidden;padding:clamp(30px,5vw,60px) clamp(16px,4vw,50px) 0;
  background:
   radial-gradient(ellipse at 50% 0%,rgba(178,138,88,.22),transparent 55%),
   linear-gradient(180deg,#2c1b13 0%,#24170f 64%,#1a100b 64%,#140c08 100%);}
.hall::before{content:"";position:absolute;left:0;right:0;bottom:0;height:36%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 60px,transparent 60px 120px);transform:perspective(400px) rotateX(55deg);transform-origin:bottom}
.hall .lamp{position:absolute;top:0;width:2px;height:40px;background:rgba(178,138,88,.4)}
.hall .lamp::after{content:"";position:absolute;bottom:-10px;left:-9px;width:20px;height:12px;border-radius:0 0 10px 10px;background:#c9a06a;box-shadow:0 0 40px 18px rgba(240,190,120,.25)}
.doors3{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,4vw,56px);max-width:860px;margin:0 auto;align-items:end}
.hdoor{appearance:none;background:none;border:0;padding:0;color:var(--cream);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:inherit}
.hdoor[aria-disabled="true"]{cursor:not-allowed}
.hdoor .plaque{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--beige);text-align:center;line-height:1.7}
.hdoor .plaque b{display:block;font-family:var(--serif);font-size:clamp(17px,2.2vw,24px);letter-spacing:.02em;text-transform:none;color:var(--cream);font-weight:500}
.hdoor[aria-disabled="true"] .doorframe{filter:brightness(.55) saturate(.7)}
.hdoor .lock{display:inline-flex;gap:6px;align-items:center;color:rgba(215,196,168,.6)}
.hdoor .lock svg{width:12px;height:12px}
.hdoor:not([aria-disabled="true"]):hover .doorframe{box-shadow:0 0 0 1px var(--gold),0 20px 60px rgba(240,190,120,.18)}
.hall .floorpad{height:clamp(22px,4vw,40px)}
.hall-zoom{transition:transform 1.5s cubic-bezier(.5,0,.2,1) .45s;transform-origin:16% 60%}
.hall-zoom.go{transform:scale(2.4)}

/* ---------- door component ---------- */
.doorframe{position:relative;width:100%;aspect-ratio:1/2.05;border:clamp(6px,1.1vw,12px) solid #3e281c;border-bottom-width:0;border-radius:48% 48% 0 0/22% 22% 0 0;
  background:#0d0806;perspective:1100px;box-shadow:0 0 0 1px rgba(178,138,88,.25),0 30px 60px rgba(0,0,0,.45);overflow:hidden;transition:box-shadow .3s}
.doorframe .light{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,#ffe2b0 0%,#e9b46e 35%,#9b6634 70%,#3a2216 100%);opacity:.0;transition:opacity 1.2s ease .3s}
.doorframe .gap{position:absolute;right:0;top:0;bottom:0;width:3px;background:linear-gradient(#f1c58a,#d99a52);opacity:.55;box-shadow:0 0 14px 3px rgba(240,190,120,.45)}
.doorframe .spill{position:absolute;left:-10%;right:-10%;bottom:-2px;height:10px;background:radial-gradient(ellipse at 50% 100%,rgba(250,200,130,.7),transparent 70%)}
.leaf{position:absolute;inset:0;border-radius:inherit;transform-origin:0% 50%;transition:transform 1.25s var(--ease) .32s;
  background:linear-gradient(100deg,#4b2e1f,#5d3a27 40%,#4a2d1e 70%,#3a2318);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);backface-visibility:hidden}
.leaf .pn{position:absolute;left:14%;right:14%;border:1px solid rgba(0,0,0,.35);box-shadow:inset 1px 1px 0 rgba(255,220,170,.08),inset -1px -1px 0 rgba(0,0,0,.25);border-radius:2px}
.leaf .p1{top:16%;height:34%;border-radius:40% 40% 2px 2px/18% 18% 2px 2px}
.leaf .p2{top:56%;height:34%}
.leaf .handle{position:absolute;right:12%;top:53%;width:16%;height:2.4%;min-height:4px;background:linear-gradient(#e4c48e,#a77c43);border-radius:4px;transform-origin:85% 50%;transition:transform .35s ease}
.leaf .handle::after{content:"";position:absolute;right:0;top:50%;width:9px;height:9px;transform:translate(30%,-50%);border-radius:50%;background:#c9a067}
.door-open .handle{transform:rotate(28deg)}
.door-open .leaf{transform:rotateY(-80deg)}
.door-open .light{opacity:1}
.door-open .gap{opacity:0}

/* transition screen */
.trans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,6vw,80px);align-items:center;min-height:calc(100vh - 160px)}
.trans .stage{max-width:340px;width:100%;margin:0 auto;transition:transform 1.5s cubic-bezier(.5,0,.2,1) .6s;transform-origin:50% 55%}
.trans .stage.go{transform:scale(2.6)}
.trans h2{font-size:clamp(34px,4.6vw,54px)}

/* ---------- rooms ---------- */
.roomhead{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.scene{position:relative;overflow:hidden;border:1px solid var(--line);background:#120b07}
.scene img{display:block;width:100%;height:auto;transition:filter 1.6s ease,transform 8s ease,opacity 1.6s}
.scene.veiled img{filter:blur(14px) brightness(.45) saturate(.8);transform:scale(1.04)}
.scene.fading img{filter:blur(18px) brightness(.25) sepia(.4);opacity:.7;transform:scale(1.06)}
.scene.obs{display:flex;justify-content:center;background:#0d0806}
.scene.obs img{width:auto;max-width:100%;max-height:calc(100vh - 170px)}
.scene .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.timer{position:absolute;top:14px;right:14px;background:rgba(33,21,15,.82);border:1px solid var(--line);padding:10px 16px;font-size:11px;letter-spacing:.24em;font-weight:600;color:var(--beige);display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.timer b{font-family:var(--serif);font-size:30px;letter-spacing:0;color:var(--cream);font-weight:500;min-width:2ch;text-align:right;line-height:1}
.timer .ring{width:30px;height:30px}
.timer .ring circle{fill:none;stroke-width:2}
.timer.warn{border-color:var(--gold)}
.timer.warn b{color:#e6c38f}
.timer.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,138,88,.0)}50%{box-shadow:0 0 0 6px rgba(178,138,88,.22)}}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,226,180,.7);filter:blur(.6px);animation:float linear infinite}
@keyframes float{from{transform:translate(0,0);opacity:0}15%{opacity:.8}85%{opacity:.6}to{transform:translate(40px,-160px);opacity:0}}
.sun{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,220,150,.20),transparent 45%);mix-blend-mode:screen;animation:sun 9s ease-in-out infinite alternate}
@keyframes sun{from{opacity:.35}to{opacity:1}}
.spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,215,160,.22),transparent 35%);mix-blend-mode:screen;animation:spot 14s ease-in-out infinite alternate}
@keyframes spot{0%{background-position:0 0;opacity:.6}50%{opacity:1}100%{opacity:.5;transform:translateX(30%)}}
.room-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.sticky{position:sticky;top:90px}
.timesup{text-align:center;max-width:520px;margin:28px auto 0}
.timesup h3{font-size:clamp(34px,5vw,52px)}

/* kitchen */
textarea,input[type=text]{width:100%;background:rgba(242,231,213,.06);border:1px solid rgba(215,196,168,.35);color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.6;padding:14px 16px;border-radius:2px;resize:vertical}
textarea{min-height:150px}
textarea::placeholder,input::placeholder{color:rgba(215,196,168,.55)}
textarea:focus,input:focus{outline:none;border-color:var(--gold);background:rgba(242,231,213,.09)}
label.q{display:block;font-family:var(--serif);font-size:22px;margin:18px 0 8px}
.phrases{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.phrases li{font-size:13.5px;border:1px solid var(--line);padding:7px 11px;color:var(--beige);transition:.3s;border-radius:2px}
.phrases li.used{border-color:var(--teal);color:var(--cream);background:rgba(94,140,130,.18)}
.phrases li.used::before{content:"✓ ";color:#8fc0b4}
.example{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:var(--beige);border-left:1px solid var(--gold);padding-left:16px;margin:12px 0}
details.hint{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.hint summary{cursor:pointer;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--gold);list-style:none;min-height:40px;display:flex;align-items:center}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::before{content:"+";display:inline-block;width:18px;font-size:16px}
details.hint[open] summary::before{content:"–"}
details.hint ul{margin:6px 0 0;padding-left:20px;line-height:1.9;color:var(--beige)}
.done-msg{text-align:center;padding:40px 10px}
.done-msg h3{font-size:clamp(34px,5vw,54px)}

/* gallery canvas */
.canvas-wrap{position:relative;background:#F2E7D5;border:1px solid #21150F;box-shadow:0 0 0 6px rgba(33,21,15,.6),0 20px 50px rgba(0,0,0,.45);aspect-ratio:4/3;touch-action:none}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.canvas-wrap .empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(52,32,22,.45);font-family:var(--serif);font-style:italic;font-size:20px;pointer-events:none;transition:opacity .3s}
.dtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dtool{appearance:none;border:1px solid rgba(215,196,168,.35);background:transparent;color:var(--cream);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:2px}
.dtool svg{width:16px;height:16px}
.dtool[aria-pressed="true"]{background:var(--burg);border-color:var(--gold)}
.dtool:hover{border-color:var(--gold)}

/* final door */
.fdoor{position:relative;height:calc(100vh - 62px);min-height:520px;overflow:hidden;background:#000}
.fdoor img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;transform-origin:68% 52%;transform:scale(1.02);transition:transform 4.2s cubic-bezier(.45,0,.2,1),filter 4s}
.fdoor.go img{transform:scale(3.2);filter:brightness(1.25)}
.fdoor .glow{position:absolute;inset:0;background:radial-gradient(circle at 68% 52%,rgba(255,224,170,.95),rgba(230,170,95,.3) 25%,transparent 55%);mix-blend-mode:screen;opacity:0;transition:opacity 2.6s ease 1.4s}
.fdoor.go .glow{opacity:1}
.fdoor .veil{position:absolute;inset:0;background:var(--espresso);opacity:0;transition:opacity 1.2s ease 3.6s}
.fdoor.go .veil{opacity:1}
.fdoor .vign{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 50%,transparent 40%,rgba(10,6,4,.7))}
.fdoor .final-text{position:absolute;inset:0;display:grid;place-items:center;padding:24px;opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
.fdoor.show .final-text{opacity:1;transform:none;pointer-events:auto}
.final-text .inner{max-width:560px;text-align:center}
.final-text h2{margin:0 0 20px}
.final-text .ask{font-family:var(--serif);font-style:italic;font-size:clamp(26px,3.4vw,36px);color:var(--cream);margin:18px 0 6px}

/* test */
.test-cards{grid-template-columns:repeat(4,1fr)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--beige);margin:16px 0}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border:2px solid}
.res-lists{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.res-lists h4{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin:0 0 10px;font-weight:700}
.res-lists ul{margin:0;padding-left:18px;line-height:1.85;color:var(--beige);font-size:14.5px}
.scorebig{font-family:var(--serif);font-size:clamp(56px,8vw,96px);line-height:1}
.scorebig small{font-size:.38em;color:var(--beige)}

/* reflect / report */
.reflect{max-width:620px;margin:0 auto;text-align:center}
.chosen{display:inline-flex;flex-direction:column;align-items:center;gap:10px;border:1px solid var(--gold);padding:24px 34px;margin:20px 0;background:rgba(100,43,50,.22)}
.chosen svg{width:64px;height:64px;color:var(--gold)}
.chosen span{font-family:var(--serif);font-size:26px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:10px;text-align:left}
.opts .chip{width:100%;justify-content:flex-start}
.report{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,60px)}
.report .title{font-size:clamp(40px,6.6vw,78px);margin:16px 0 18px;color:var(--cream)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0}
.scores > div{padding:18px 0}
.scores > div + div{border-left:1px solid var(--line);padding-left:22px}
.scores .num{font-family:var(--serif);font-size:clamp(44px,6vw,64px);line-height:1}
.scores .num small{font-size:.45em;color:var(--beige)}
table.bd{width:100%;border-collapse:collapse;font-size:14px}
table.bd td{padding:9px 0;border-bottom:1px solid var(--line);color:var(--beige)}
table.bd td:last-child{text-align:right;color:var(--cream);font-variant-numeric:tabular-nums}
table.bd tr.tot td{color:var(--cream);font-weight:700;border-bottom:0;padding-top:14px}
.drawthumb{width:100%;aspect-ratio:4/3;background:#F2E7D5;border:1px solid var(--line);display:block;object-fit:contain}
.share-box{margin-top:14px}
.share-box textarea{min-height:120px;font-size:14px}
.status{font-size:13px;color:#8fc0b4;margin-top:10px;min-height:20px}
.disclaim{font-size:12.5px;color:rgba(215,196,168,.7);margin-top:26px;line-height:1.6}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;background:rgba(15,9,6,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto;padding:clamp(10px,4vw,48px) 12px}
.modal.open{display:flex;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal .box{position:relative;max-width:720px;width:100%;background:var(--espresso);border:1px solid var(--line);padding:clamp(24px,5vw,56px);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.modal .close{position:absolute;top:14px;right:14px}
.modal h2{font-size:clamp(36px,5vw,56px)}
.modal h4{font-family:var(--sans);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:30px 0 10px;font-weight:700}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vocab div{border:1px solid var(--line);padding:16px}
.vocab b{font-family:var(--serif);font-size:21px;font-weight:600;display:block;margin-bottom:6px}
.vocab p{font-size:14.5px;margin:0 0 6px}
.vocab em{font-size:14px;color:var(--beige)}
.sources{list-style:none;padding:0;margin:0}
.sources li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sources a{color:var(--cream);text-decoration-color:var(--gold);text-underline-offset:4px}

/* ---------- entrance anim ---------- */
#app.entering .rise{animation:rise .8s var(--ease) both}
#app.entering .d1{animation-delay:.08s}#app.entering .d2{animation-delay:.16s}#app.entering .d3{animation-delay:.24s}#app.entering .d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .test-cards{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:820px){
  .cover{grid-template-columns:1fr;min-height:auto;padding-top:0}
  .coverimg{height:52vh;order:-1;margin:0 calc(-1*clamp(18px,4vw,36px))}
  .cover .txt{padding:0}
  .cover h1{margin-top:6px}
  .trans{grid-template-columns:1fr;min-height:auto;gap:28px}
  .trans .stage{max-width:180px}
  .room-grid,.report{grid-template-columns:1fr}
  .sticky{position:static}
  .res-lists{grid-template-columns:1fr}
  .vocab{grid-template-columns:1fr}
  .progress .lbl{display:none}
  .steps .bar{width:12px}
  .steps .nm{display:none}
  .pts .w{display:none}
}
@media (max-width:560px){
  .brand{letter-spacing:.3em;font-size:11px}
  .top{gap:8px}
  .test-cards{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card{min-height:116px;padding:16px 8px 12px}
  .actions .btn{width:100%}
  .actions .btn.link{width:auto}
  .scores{grid-template-columns:1fr}
  .scores > div + div{border-left:0;padding-left:0;border-top:1px solid var(--line)}
  .timer{top:8px;right:8px;padding:8px 12px}
  .timer b{font-size:24px}
  .doors3{gap:12px}
  .hdoor .plaque{letter-spacing:.14em;font-size:9.5px}
  /* thumb-friendly sticky CTA */
  .thumb{position:sticky;bottom:0;z-index:20;background:linear-gradient(rgba(33,21,15,0),var(--espresso) 35%);padding:22px 0 14px;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;transition-delay:0s!important}
  .dust,.sun,.spot{display:none}
}

/* ---------------- navigation ---------------- */
var timer=null;
function clearTimer(){ if(timer){clearInterval(timer);timer=null;} }
function go(screen,opts){
  opts=opts||{};
  clearTimer();
  var swap=function(){ st.screen=screen; save(); app.classList.add('entering'); clearTimeout(window.__ent); window.__ent=setTimeout(function(){app.classList.remove('entering');},1400); render(); window.scrollTo(0,0); app.classList.remove('out'); try{app.focus({preventScroll:true});}catch(e){} };
  if(opts.instant){ swap(); return; }
  app.classList.add('out'); setTimeout(swap,T(420));
}
function rerender(){ save(); render(); }

function hasProgress(){ return st._resume && st._resume!=='cover'; }

screens.intro=function(){
  return '<section class="wrap intro" aria-labelledby="t2">'+back('cover')+
   '<div class="eyebrow rise">Before you enter</div>'+
   '<h2 id="t2" class="rise d1" style="margin:14px 0 28px">Have you ever walked into a room and completely forgotten why you came in?</h2>'+
   '<div class="rise d2">'+
   '<p class="lead">Maybe you went to the kitchen to get a glass of water, but once you got there, you couldn\'t remember what you needed.</p>'+
   '<p>Or you entered a supermarket and suddenly forgot half of your shopping list.</p>'+
   '<p>This familiar experience is sometimes called the <strong>Doorway Effect</strong>.</p>'+
   '<p>It describes how moving from one place to another can sometimes make it harder to remember what you were just thinking about or planning to do.</p>'+
   '<p>One possible explanation is that our brain organises experiences into separate events. A change of location can act like a boundary between them.</p>'+
   '<p class="muted">The effect does not happen every time, and research findings are mixed.</p></div>'+
   '<div class="panel challenge rise d3"><div class="kicker">A small challenge</div>'+
   '<h3 style="margin:12px 0 10px">How much do you actually remember when you move from one room to another?</h3>'+
   '<p style="margin:0">Let\'s find out.</p></div>'+
   '<div class="actions rise d4"><button class="btn" data-go="hall">Enter the house →</button>'+
   '<button class="btn link" data-modal="science">Learn more about the science</button></div>'+
  '</section>';
};

function doorHTML(){ return '<div class="doorframe"><div class="light"></div><div class="spill"></div><div class="leaf"><div class="pn p1"></div><div class="pn p2"></div><div class="handle"></div></div><div class="gap"></div></div>'; }

screens.hall=function(){
  var d=[['01','The Study',true],['02','The Kitchen',false],['03','The Gallery',false]];
  var doors=d.map(function(x,i){
    return '<button class="hdoor '+(x[2]?'active':'')+'" '+(x[2]?'id="door01" aria-label="Enter Door 01, The Study"':'aria-disabled="true" aria-label="Door '+x[0]+', '+x[1]+', locked" tabindex="-1"')+'>'+doorHTML()+
     '<span class="plaque">Door '+x[0]+'<b>'+x[1]+'</b>'+(x[2]?'<span style="color:var(--gold)">Enter</span>':'<span class="lock">'+icon('lock','')+'Locked</span>')+'</span></button>';
  }).join('');
  return '<section class="wrap" aria-labelledby="t3">'+back('intro')+
   '<div class="roomhead"><div><div class="eyebrow rise">Enter the house</div>'+
   '<h2 id="t3" class="rise d1">Three rooms. Three challenges.<br>One final test.</h2></div>'+
   '<p class="rise d2" style="max-width:360px;margin:0">Your mission is simple:<br>Explore the house, complete the challenges and try not to leave too much behind.</p></div>'+
   '<div class="hall rise d3"><span class="lamp" style="left:22%"></span><span class="lamp" style="left:50%"></span><span class="lamp" style="left:78%"></span>'+
   '<div class="hall-zoom" id="hallZoom"><div class="doors3">'+doors+'</div></div><div class="floorpad"></div></div>'+
   '<p class="small muted rise d4" style="margin-top:16px;text-align:center">Only the first door is open. Click it to begin.</p>'+
  '</section>';
};

function dust(){ var h='<div class="dust" aria-hidden="true">'; for(var i=0;i<26;i++){ h+='<i style="left:'+(Math.random()*90)+'%;top:'+(30+Math.random()*65)+'%;animation-duration:'+(7+Math.random()*9)+'s;animation-delay:-'+(Math.random()*12)+'s;opacity:.5;transform:scale('+(0.5+Math.random())+')"></i>'; } return h+'</div>'; }

function startObserve(){
  st.studyStep='observe'; rerender();
  var sc=document.getElementById('scene'); if(sc) sc.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
  var left=20;
  var tEl=document.getElementById('tleft'), box=document.getElementById('timer'), ring=document.getElementById('ringc'), sr=document.getElementById('srTime');
  clearTimer();
  timer=setInterval(function(){
    left--; if(tEl) tEl.textContent=left;
    if(ring) ring.setAttribute('stroke-dashoffset',String(94.25*(20-left)/20));
    if(left===10){ box.classList.add('warn'); sr.textContent='10 seconds left'; }
    if(left===5){ box.classList.add('pulse'); sr.textContent='5 seconds left'; }
    if(left<=0){ clearTimer(); st.studyObserved=true; st.studyStep='timesup'; save();
      var sc=document.getElementById('scene'); var b=document.getElementById('timer');
      if(b) b.remove(); if(sc){ sc.classList.add('fading'); var dd=sc.querySelector('.dust'); if(dd) dd.remove(); }
      setTimeout(function(){ render(); var ts=document.querySelector('.timesup'); if(ts) ts.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'}); },T(1300));
    }
  },1000);
}

/* ----- door transitions ----- */
function transScreen(id,eyebrow,title,lines,btn,next){
  return '<section class="wrap" aria-labelledby="'+id+'"><div class="trans">'+
   '<div class="stage rise" id="stage">'+doorHTML()+'</div>'+
   '<div><div class="eyebrow rise">'+eyebrow+'</div><h2 id="'+id+'" class="rise d1" style="margin:14px 0 22px">'+title+'</h2>'+
   lines.map(function(l,i){return '<p class="rise d'+(i+2)+(i===0?' lead':'')+'">'+l+'</p>';}).join('')+
   '<div class="actions rise d4 thumb"><button class="btn" data-open="'+next+'">'+btn+'</button></div></div></div></section>';

function openDoor(next){
  var stage=document.getElementById('stage'), btn=document.querySelector('[data-open]');
  if(btn) btn.disabled=true;
  stage.querySelector('.doorframe').parentNode.classList.add('door-open');
  stage.classList.add('door-open'); stage.classList.add('go');
  var w=document.getElementById('whiteout');
  setTimeout(function(){ w.classList.add('on'); },T(1350));
  setTimeout(function(){ go(next,{instant:true}); setTimeout(function(){w.classList.remove('on');},T(120)); },T(1950));
}

screens.bag=function(){
  var n=st.bag.length;
  var cards=TRAVEL.map(function(o){ var on=st.bag.indexOf(o.id)>=0;
    return '<button class="card" data-bag="'+o.id+'" aria-pressed="'+on+'"'+(!on&&n>=3?' aria-disabled="true"':'')+'>'+icon(o.ic)+'<span>'+o.name+'</span><span class="tick">'+icon('check','')+'</span></button>'; }).join('');
  return '<section class="wrap" aria-labelledby="t7"><div class="room-grid">'+
   '<div class="rise"><div class="eyebrow">Between rooms</div><h2 id="t7" style="margin:12px 0 22px">A weekend away</h2>'+
   '<p class="lead">You\'re leaving for a spontaneous weekend trip.</p><p>You can only take <strong>three</strong> things with you.</p><p>What would you choose?</p>'+
   '<div class="counter" aria-live="polite"><b>'+n+'</b> / 3 selected</div>'+
   (n===3?'<div class="panel rise" style="margin-top:20px"><div class="kicker">Interesting choice.</div><p style="margin:10px 0 0">Let\'s see what\'s waiting in the next room.</p></div>':'')+
   '</div>'+
   '<div class="rise d1"><div class="cards" role="group" aria-label="Travel items">'+cards+'</div>'+
   '<div class="actions thumb"><button class="btn" id="bagBtn" '+(n===3?'':'disabled')+'>Continue →</button></div></div></div></section>';
};

var draw={tool:'pen',cur:null,ctx:null,cv:null};
function initCanvas(){
  var cv=document.getElementById('cv'); if(!cv) return; draw.cv=cv; draw.ctx=cv.getContext('2d');
  function size(){ if(!cv.isConnected){ window.removeEventListener('resize',size); return; } var r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); redraw(); }
  size(); window.addEventListener('resize',size);
  function pt(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; }
  cv.addEventListener('pointerdown',function(e){ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(x){} draw.cur={tool:draw.tool,p:[pt(e)]}; st.strokes.push(draw.cur); redraw(); });
  cv.addEventListener('pointermove',function(e){ if(!draw.cur) return; e.preventDefault(); var ev=e.getCoalescedEvents?e.getCoalescedEvents():[e]; ev.forEach(function(x){draw.cur.p.push(pt(x));}); redraw(); });
  function end(){ if(draw.cur){ draw.cur=null; save(); } }
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
}
function redraw(){
  var c=draw.ctx, cv=draw.cv; if(!c) return; var w=cv.width,h=cv.height, d=window.devicePixelRatio||1;
  c.fillStyle='#F2E7D5'; c.fillRect(0,0,w,h); c.lineCap='round'; c.lineJoin='round';
  st.strokes.forEach(function(s){
    c.strokeStyle= s.tool==='eraser'?'#F2E7D5':'#21150F'; c.lineWidth=(s.tool==='eraser'?22:3.2)*d*Math.max(.8,Math.min(1.4,w/(560*d)));
    c.beginPath(); s.p.forEach(function(p,i){ var x=p[0]*w,y=p[1]*h; if(i===0){c.moveTo(x,y);c.lineTo(x+.01,y+.01);} else c.lineTo(x,y); }); c.stroke();
  });
  var em=document.getElementById('cempty'); if(em) em.style.opacity=st.strokes.length?0:1;
}
function hasInk(){ return st.strokes.some(function(s){return s.tool==='pen';}); }

function playFinalDoor(){
  var f=document.getElementById('fdoor'); if(!f) return;
  setTimeout(function(){ f.classList.add('go'); },T(500));
  setTimeout(function(){ f.classList.add('show'); var b=f.querySelector('[data-go]'); if(b) b.focus({preventScroll:true}); },T(4700));
}

/* ----- final test ----- */
screens.test=function(){
  var sub=st.submitted, m=memory();
  var cards=st.order.map(function(id){
    var o=byId(id), on=st.finalSel.indexOf(id)>=0, cls='', tag='';
    if(sub){ if(on&&CORRECT[id]){cls='r-correct';tag='Remembered';} else if(on){cls='r-wrong';tag='Not in the study';} else if(CORRECT[id]){cls='r-missed';tag='Missed';} else {cls='r-ok';tag='';} }
    return '<button class="card '+cls+'" data-final="'+id+'" aria-pressed="'+on+'" '+(sub?'disabled':'')+'>'+icon(o.ic)+'<span>'+o.name+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+(sub?'':'<span class="tick">'+icon('check','')+'</span>')+'</button>';
  }).join('');
  if(!sub){
    return '<section class="wrap" aria-labelledby="t12"><div class="roomhead"><div><div class="eyebrow">Final challenge</div><h2 id="t12">Which of these objects were in the study?</h2></div>'+
     '<p style="max-width:330px;margin:0">Select everything you remember seeing.<br><span class="muted">Take your time.</span></p></div>'+
     '<div class="cards test-cards rise" role="group" aria-label="Objects">'+cards+'</div>'+
     '<div class="thumb"><div class="counter" aria-live="polite">Objects selected: <b>'+st.finalSel.length+'</b> / 16</div>'+
     '<div class="actions" style="margin-top:14px"><button class="btn" id="checkBtn" '+(st.finalSel.length?'':'disabled')+'>Check my memory →</button></div></div></section>';
  }
  function list(arr){ return arr.length?'<ul>'+arr.map(function(id){return '<li>'+byId(id).name+'</li>';}).join('')+'</ul>':'<p class="small muted">None</p>'; }
  var corr=st.finalSel.filter(function(id){return CORRECT[id];}), wrong=st.finalSel.filter(function(id){return !CORRECT[id];}), missed=OBJECTS.map(function(o){return o.id;}).filter(function(id){return st.finalSel.indexOf(id)<0;});
  return '<section class="wrap" aria-labelledby="t13"><div class="roomhead"><div><div class="eyebrow">Final challenge · Results</div><h2 id="t13">Here\'s what stayed with you.</h2></div>'+
   '<div><div class="kicker">Memory score</div><div class="scorebig">'+m.score+'<small> / 24</small></div></div></div>'+
   '<div class="legend"><span><i style="border-color:var(--teal)"></i>Correctly remembered</span><span><i style="border-color:var(--wine)"></i>Incorrectly selected</span><span><i style="border-color:var(--grey)"></i>Missed</span></div>'+
   '<div class="cards test-cards rise">'+cards+'</div>'+
   '<div class="res-lists rise d1"><div class="panel"><h4 style="color:#8fc0b4">Correctly remembered · '+corr.length+'</h4>'+list(corr)+'</div>'+
   '<div class="panel"><h4 style="color:var(--grey)">Missed · '+missed.length+'</h4>'+list(missed)+'</div>'+
   '<div class="panel"><h4 style="color:#d58b90">Incorrectly selected · '+wrong.length+'</h4>'+list(wrong)+'</div></div>'+
   '<p class="small muted" style="margin-top:18px">+2 for each object you remembered, −1 for each object that was not in the study. The score never goes below zero.</p>'+
   '<div class="actions thumb"><button class="btn" data-go="reflect">Continue →</button></div></section>';
};

/* ----- reflection ----- */
screens.reflect=function(){
  var o=byId(st.personal)||OBJECTS[0];
  return '<section class="wrap reflect" aria-labelledby="t14"><div class="eyebrow rise" style="justify-content:center">One last question...</div>'+
   '<h2 id="t14" class="rise d1" style="margin:16px 0 18px">Do you remember what it was?</h2>'+
   '<p class="rise d1">Earlier, you chose one object to take with you from the study.</p>'+
   '<div class="chosen rise d2">'+icon(o.ic,'')+'<span>'+o.name+'</span></div>'+
   '<h3 class="rise d3" style="font-size:24px;margin-bottom:12px">Did you remember your chosen object?</h3>'+
   '<div class="opts rise d3" role="radiogroup" aria-label="Did you remember your chosen object?">'+REFLECT.map(function(r,i){return '<button class="chip" role="radio" data-reflect="'+i+'" aria-pressed="'+(st.reflection===i)+'" aria-checked="'+(st.reflection===i)+'">'+r+'</button>';}).join('')+'</div>'+
   '<p class="small muted rise d4" style="margin-top:14px">Just a playful reflection. It doesn\'t change your score.</p>'+
   '<div class="actions rise d4" style="justify-content:center"><button class="btn" data-go="report" '+(st.reflection===null?'disabled':'')+'>See my memory report →</button></div></section>';
};

/* ----- report ----- */
function shareText(){ var m=memory(), t=titleFor(m.score);
  return 'I just played THE DOORWAY GAME by DÉBUT!\n\nMemory score: '+m.score+'/24.\n\nMy result: '+t.t+'.\n\nWhat did YOU leave behind?'; }
screens.report=function(){
  var m=memory(), t=titleFor(m.score), b=breakdown();
  var perfect=m.correct===12&&m.wrong===0;
  var rows=b.rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+' / '+r[2]+'</td></tr>';}).join('')+'<tr class="tot"><td>Adventure score</td><td>'+b.total+' / 43</td></tr>';
  var refl=st.reflection!==null?'<p class="small muted">Your chosen object was '+byId(st.personal).name.toLowerCase()+'. You said: “'+REFLECT[st.reflection]+'”</p>':'';
  return '<section class="wrap" aria-labelledby="t15"><div class="report">'+
   '<div><div class="eyebrow rise">Your memory report</div>'+
   '<h2 id="t15" class="title rise d1">'+t.t.replace('THE ','The ').toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();})+'</h2>'+
   '<div class="rise d2">'+t.l.map(function(l,i){return '<p class="'+(i===0?'lead':'')+'">'+l+'</p>';}).join('')+
   '<p>You remembered '+m.correct+' out of 12 objects from the study'+(m.wrong?', and picked '+m.wrong+' that '+(m.wrong===1?'was':'were')+' never there':'')+'.</p>'+
   (perfect?'<p>Every object made it through the doors with you.</p>':'<p>Some details stayed with you, while others disappeared somewhere between the kitchen and the gallery.</p>')+
   '<p>Perhaps the next time you walk into a room, you\'ll pay a little more attention to what you came there for.</p><p>Or perhaps you\'ll forget again.</p><p>That\'s part of the fun.</p></div>'+
   '<div class="scores rise d3"><div><div class="kicker">Your memory score</div><div class="num">'+m.score+'<small> / 24</small></div></div>'+
   '<div><div class="kicker">Your adventure score</div><div class="num">'+b.total+'<small> / 43</small></div></div></div>'+
   '<div class="actions rise d4"><button class="btn" id="shareBtn">Share my result</button><button class="btn ghost" data-modal="learn">Explore the Doorway Effect</button><button class="btn link" id="againBtn">Play again</button></div>'+
   '<div class="status" id="shareStatus" aria-live="polite"></div><div id="shareBox"></div>'+
   '<p class="disclaim">The Doorway Game is a playful interpretation of the Doorway Effect, not a scientific memory test. Your score is not a measure of intelligence, cognitive ability or memory health.</p></div>'+
   '<div class="rise d2"><div class="panel"><div class="kicker" style="margin-bottom:10px">Points breakdown</div><table class="bd">'+rows+'</table></div>'+
   (st.drawing?'<div style="margin-top:20px"><div class="kicker" style="margin-bottom:10px">From the gallery'+(st.drawName.trim()?' · '+esc(st.drawName.trim()):'')+'</div><img class="drawthumb" src="'+st.drawing+'" alt="Your drawing from the gallery"></div>':'')+
   '<div style="margin-top:16px">'+refl+'</div></div></div></section>';
};

/* ---------------- modal ---------------- */
function srcList(){ return '<ul class="sources">'+SOURCES.map(function(s){return '<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+' ↗</a></li>';}).join('')+'</ul>'; }
var MODALS={
 science:function(){ return '<div class="eyebrow">The science</div><h2 id="modalTitle" style="margin-top:12px">The Doorway Effect</h2>'+
  '<h4>What is it?</h4><p>The Doorway Effect is a memory phenomenon in which passing through a doorway or moving into a new environment can sometimes make information from the previous moment harder to recall.</p>'+
  '<h4>Why might it happen?</h4><p>One explanation is event segmentation. Our brain organises everyday experiences into separate events. A change of environment can act as a boundary between them.</p>'+
  '<p>Another possible factor is attention. A new environment introduces different sights, sounds and information, which can compete for our attention.</p>'+
  '<h4>Is it scientifically proven?</h4><p>Research has produced mixed results. Early experiments found that passing through doorways could affect memory, but later experiments did not consistently reproduce the effect in every condition.</p>'+
  '<p>It is therefore better understood as a possible memory phenomenon, not a universal rule.</p><h4>Sources</h4>'+srcList(); },
 learn:function(){
  var V=[['Event boundary','A moment that marks the transition between two events.','Crossing a doorway can act as an event boundary.'],
   ['Working memory','The part of memory that temporarily holds and processes information.','Working memory helps us keep a goal in mind.'],
   ['Cognitive shift','A change in mental focus or state.','Entering a new environment can cause a cognitive shift.'],
   ['Context switch','A shift from one task, environment or mental context to another.','Moving from your workspace to the kitchen is a context switch.'],
   ['Mental reset','An informal expression for a brief adjustment to a new situation.','A change of environment can feel like a mental reset.'],
   ['Attentional resources','The limited mental capacity available for focusing and processing information.','New surroundings can compete for our attentional resources.']];
  return '<div class="eyebrow">Learn more</div><h2 id="modalTitle" style="margin-top:12px">The Doorway Effect</h2><div class="sub" style="font-size:24px;margin-top:8px">Why do we forget what we came here for?</div>'+
  '<h4>01 · What is it?</h4><p>The Doorway Effect describes how moving from one place to another can sometimes make it harder to remember what you were just thinking about or planning to do.</p>'+
  '<h4>02 · Why might it happen?</h4><p>One possible explanation involves event boundaries.</p><p>Our brain organises experiences into separate events. When we move into a new environment, this change can act as a boundary between one event and another.</p><p>Attention and working memory may also play a role.</p><p>A new environment introduces new information, which can compete with what we were trying to remember.</p>'+
  '<h4>03 · What does research say?</h4><p>Early research found evidence that crossing doorways could affect memory.</p><p>However, later experiments did not consistently reproduce the effect in all conditions.</p><p>The findings are therefore more nuanced than the simple idea that every doorway makes us forget.</p>'+
  '<h4>04 · Useful vocabulary</h4><div class="vocab">'+V.map(function(v,i){return '<div><b>'+(i+1)+'. '+v[0]+'</b><p>'+v[1]+'</p><em>Example: '+v[2]+'</em></div>';}).join('')+'</div>'+
  '<h4>05 · Further reading</h4>'+srcList(); }
};
var lastFocus=null;
function openModal(k){
  lastFocus=document.activeElement;
  var m=document.getElementById('modal'), b=document.getElementById('modalBox');
  b.innerHTML='<button class="iconbtn close" data-close aria-label="Close">✕</button>'+MODALS[k]()+'<div class="actions"><button class="btn ghost" data-close>Back to the game</button></div>';
  m.classList.add('open'); m.scrollTop=0; document.body.style.overflow='hidden';
  setTimeout(function(){ var c=b.querySelector('.close'); if(c) c.focus(); },30);
}
function closeModal(){ var m=document.getElementById('modal'); m.classList.remove('open'); document.body.style.overflow=''; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }

/* ---------------- render + events ---------------- */
function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function render(){
  app.innerHTML=screens[st.screen]();
  renderChrome();
  if(st.screen==='gallery') initCanvas();
  if(st.screen==='finaldoor') playFinalDoor();
  if(st.screen==='kitchen' && st.kitchenStep==='write'){
    var ta=document.getElementById('recipe');
    ta.addEventListener('input',function(){ st.recipe=ta.value; save(); var u=phrasesUsed(st.recipe);
      var lis=document.querySelectorAll('#phr li'); for(var i=0;i<lis.length;i++) lis[i].className=u[i]?'used':'';
      document.getElementById('phrCount').innerHTML='Phrases used: <b>'+u.filter(Boolean).length+'</b> / 2'; document.getElementById('nudge').innerHTML=''; });
  }
  if(st.screen==='gallery'){
    var dn=document.getElementById('dname'), dw=document.getElementById('dwhy');
    dn.addEventListener('input',function(){st.drawName=dn.value;save();}); dw.addEventListener('input',function(){st.drawWhy=dw.value;save();});
  }
}
var nudged={};
function nudge(key,html){ if(nudged[key]) return false; nudged[key]=true; document.getElementById('nudge').innerHTML='<p class="note">'+html+'</p>'; return true; }

document.addEventListener('click',function(e){
  var t=e.target.closest('button, a'); if(!t) return;
  if(t.hasAttribute('data-close')){ closeModal(); return; }
  if(t.id==='infoBtn'){ openModal('learn'); return; }
  if(t.dataset.modal){ openModal(t.dataset.modal); return; }
  if(t.hasAttribute('data-resume')){ var r=st._resume; delete st._resume; go(r); return; }
  if(t.dataset.go){
    var g=t.dataset.go;
    if(g==='kitchen-pick'){ st.kitchenStep='pick'; rerender(); return; }
    if(g==='intro' && st.screen==='hall'){ go('intro'); return; }
    go(g); return;
  }
  if(t.id==='startBtn'){
    if(st._resume){ st=fresh(); nudged={}; save(); } delete st._resume; var ci=document.getElementById('coverImg'); t.disabled=true; ci.classList.add('go');
    var w=document.getElementById('whiteout');
    setTimeout(function(){ w.classList.add('on'); },T(1500));
    setTimeout(function(){ go('intro',{instant:true}); setTimeout(function(){w.classList.remove('on');},T(150)); },T(2350));
    return;
  }
  if(t.id==='door01'){
    var hd=t; hd.classList.add('door-open'); hd.disabled=true;
    document.getElementById('hallZoom').classList.add('go');
    var w2=document.getElementById('whiteout');
    setTimeout(function(){ w2.classList.add('on'); },T(1350));
    setTimeout(function(){ st.studyStep= st.studyObserved?st.studyStep:'intro'; go('study',{instant:true}); setTimeout(function(){w2.classList.remove('on');},T(120)); },T(2000));
    return;
  }
  if(t.id==='observeBtn'||t.hasAttribute('data-observe')){ startObserve(); return; }
  if(t.dataset.study){ st.studyStep=t.dataset.study; rerender(); window.scrollTo(0,0); return; }
  if(t.dataset.personal){ st.personal=t.dataset.personal; rerender(); return; }
  if(t.id==='takeBtn'){ st.personalDone=true; go('door1'); return; }
  if(t.dataset.open){ openDoor(t.dataset.open); return; }
  if(t.dataset.bag){ var id=t.dataset.bag, i=st.bag.indexOf(id); if(i>=0) st.bag.splice(i,1); else if(st.bag.length<3) st.bag.push(id); rerender(); return; }
  if(t.id==='bagBtn'){ st.bagDone=true; go('kitchen'); return; }
  if(t.dataset.ingr){ var id2=t.dataset.ingr, j=st.ingr.indexOf(id2); if(j>=0) st.ingr.splice(j,1); else if(st.ingr.length<5) st.ingr.push(id2); rerender(); return; }
  if(t.id==='ingrBtn'){ st.kitchenStep='write'; rerender(); window.scrollTo(0,0); return; }
  if(t.id==='recipeBtn'){
    var txt=st.recipe.trim(), u=phrasesUsed(txt).filter(Boolean).length;
    if(!txt && nudge('r0','You haven\'t written anything yet. Writing your recipe is worth up to 5 points. Press the button again to continue without it.')) return;
    if(txt && u<2 && nudge('r1','Try to use at least two of the suggested phrases for 2 extra points. Press the button again to continue as it is.')) return;
    st.recipeDone=true; st.kitchenStep='done'; rerender(); window.scrollTo(0,0); return;
  }
  if(t.dataset.tool){ draw.tool=t.dataset.tool; document.querySelectorAll('[data-tool]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t));}); return; }
  if(t.dataset.dact==='undo'){ st.strokes.pop(); redraw(); save(); return; }
  if(t.dataset.dact==='clear'){ st.strokes=[]; redraw(); save(); return; }
  if(t.id==='saveDraw'){
    if(!hasInk() && nudge('d0','Your canvas is still empty. Any drawing, even a very simple one, is worth 3 points. Press the button again to continue without one.')) return;
    if(hasInk() && (!st.drawName.trim()||!st.drawWhy.trim()) && nudge('d1','Tell us what you drew and why for up to 3 more points. Press the button again to continue as it is.')) return;
    try{ st.drawing=hasInk()?draw.cv.toDataURL('image/jpeg',.72):null; }catch(x){ st.drawing=null; }
    st.galleryDone=true; go('finaldoor'); return;
  }
  if(t.dataset.final && !st.submitted){ var f=t.dataset.final, k=st.finalSel.indexOf(f); if(k>=0) st.finalSel.splice(k,1); else st.finalSel.push(f);
    t.setAttribute('aria-pressed',String(k<0)); document.querySelector('.counter b').textContent=st.finalSel.length; document.getElementById('checkBtn').disabled=!st.finalSel.length; save(); return; }
  if(t.id==='checkBtn'){ st.submitted=true; rerender(); window.scrollTo(0,0); return; }
  if(t.dataset.reflect){ st.reflection=+t.dataset.reflect; rerender(); return; }
  if(t.id==='shareBtn'){ doShare(); return; }
  if(t.id==='againBtn'){ st=fresh(); nudged={}; save(); go('cover'); return; }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('modal').classList.contains('open')) closeModal();
  if(e.key==='Tab' && document.getElementById('modal').classList.contains('open')){
    var f=document.getElementById('modalBox').querySelectorAll('a,button'); if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') closeModal(); });

function doShare(){
  var text=shareText(), s=document.getElementById('shareStatus');
  function showBox(){ document.getElementById('shareBox').innerHTML='<div class="share-box"><label class="kicker" for="shareTxt">Copy your result</label><textarea id="shareTxt" readonly>'+esc(text)+'</textarea></div>'; var ta=document.getElementById('shareTxt'); ta.focus(); ta.select(); }
  function copy(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ s.textContent='Copied to your clipboard. Paste it anywhere you like.'; },function(){ s.textContent='Select the text below to copy it.'; showBox(); });
    } else { s.textContent='Select the text below to copy it.'; showBox(); }
  }
  if(navigator.share){ navigator.share({title:'The Doorway Game',text:text}).then(function(){ s.textContent='Thanks for sharing.'; },function(err){ if(err && err.name==='AbortError') return; copy(); }); }
  else copy();
}

/* ---------------- boot ---------------- */
if(st.screen!=='cover'){ st._resume=st.screen; st.screen='cover'; }
// returning players land on the cover with a "continue" option; refreshed mid-game players resume directly
try{ if(sessionStorage.getItem(KEY+'-live')){ if(st._resume){ st.screen=st._resume; delete st._resume; } } sessionStorage.setItem(KEY+'-live','1'); }catch(e){}
app.classList.add('entering'); setTimeout(function(){app.classList.remove('entering');},1400);
render();
})();
</script>
