<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EE">
<title>Ох, эти три буквы!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23FFD166' stroke='%2329243A' stroke-width='5'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial Black,sans-serif' font-size='34' font-weight='900' fill='%2329243A'%3E!%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. ДИЗАЙН-ТОКЕНЫ
   ========================================================= */
:root{
  --coral:#FF6B61; --fuchsia:#E84393; --sun:#FFD166; --teal:#36C9C6; --violet:#7657D6;
  --milk:#FFF8EE; --ink:#29243A; --paper:#FFFDF8; --ink-60:rgba(41,36,58,.66);
  --display:"Unbounded","Arial Black","Helvetica Neue",system-ui,sans-serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px; --bw:3px;
  --sh-sm:3px 3px 0 var(--ink); --sh:5px 5px 0 var(--ink); --sh-lg:9px 9px 0 var(--ink);
  --pop:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light; /* единый праздничный светлый образ */
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:clamp(16px,.5vw + 10px,24px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;overflow-x:hidden;
  background:var(--milk);color:var(--ink);font-family:var(--sans);font-weight:500;line-height:1.45;
  background-image:radial-gradient(rgba(41,36,58,.075) 1.3px,transparent 1.4px);background-size:22px 22px;
}
body.no-scroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg{display:block}
.ico{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

/* =========================================================
   2. БАЗОВЫЕ КОМПОНЕНТЫ
   ========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55em;
  min-height:3rem;padding:.7em 1.35em;border:var(--bw) solid var(--ink);border-radius:999px;
  background:var(--paper);font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.15;
  text-align:center;cursor:pointer;box-shadow:var(--sh-sm);user-select:none;
  transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease,opacity .15s;
}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn--primary{background:var(--sun)}
.btn--accent{background:var(--violet);color:var(--milk)}
.btn--hot{background:var(--fuchsia);color:#fff}
.btn--danger{background:var(--coral)}
.btn--ghost{background:transparent;box-shadow:none}
.btn--xl{font-size:clamp(1.15rem,2.2vw,1.6rem);min-height:4rem;padding:.8em 1.8em;box-shadow:var(--sh)}
.btn--lg{font-size:1.12rem;min-height:3.5rem}
.btn--sm{font-size:.82rem;min-height:2.5rem;padding:.45em 1em}
.icon-btn{
  display:inline-grid;place-items:center;flex:none;width:2.9rem;height:2.9rem;
  border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--paper);
  cursor:pointer;box-shadow:var(--sh-sm);transition:transform .15s ease,box-shadow .15s ease,background-color .15s;
}
.icon-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--sun)}
.icon-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.icon-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.icon-btn--sm{width:2.6rem;height:2.6rem;border-radius:12px}
.link{background:none;border:0;padding:0;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.input{
  width:100%;min-height:3.2rem;padding:.7em 1em;border:var(--bw) solid var(--ink);border-radius:var(--r-sm);
  background:#fff;font-size:1.1rem;font-weight:600;color:var(--ink);box-shadow:inset 3px 3px 0 rgba(41,36,58,.07);
}
.input::placeholder{color:rgba(41,36,58,.45)}
.input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(118,87,214,.28)}
textarea.input{resize:vertical;line-height:1.35}
.card{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--sh)}
.chip{
  display:inline-block;padding:.22em .75em;border:var(--bw) solid var(--ink);border-radius:999px;
  font-family:var(--display);font-weight:800;box-shadow:var(--sh-sm);transform:rotate(var(--rot,0deg));
}
.chip--coral{background:var(--coral)} .chip--teal{background:var(--teal)} .chip--violet{background:var(--violet);color:var(--milk)}

/* Плитка-буква */
.tile{
  display:inline-grid;place-items:center;min-width:1.15em;height:1.28em;padding:0 .16em;
  background:var(--paper);color:var(--ink);border:.06em solid var(--ink);border-radius:.2em;
  font-family:var(--display);font-weight:900;line-height:1;
  box-shadow:.08em .08em 0 var(--ink);text-shadow:.06em .06em 0 var(--tc,var(--coral));
  transform:rotate(var(--tilt,0deg));
}
.dot{flex:none;width:.15em;height:.15em;border-radius:50%;background:var(--ink);align-self:flex-end;margin-bottom:.14em}

/* Декор */
.decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor .d{position:absolute;transform:rotate(var(--r,0deg));animation:float var(--t,7s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.decor .d svg{width:100%;height:auto}

/* =========================================================
   3. ГЛАВНЫЙ ЭКРАН
   ========================================================= */
.home{position:relative;min-height:100dvh;display:grid;place-items:center;padding:clamp(2rem,5vw,3.5rem) 1rem;overflow:hidden}
.home__inner{position:relative;z-index:2;width:100%;max-width:62rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.home__art{position:relative;display:flex;align-items:center;justify-content:center;gap:.3em;font-size:clamp(3.2rem,9vw,6.6rem);padding:.35em .9em;margin-bottom:.15em}
.home__burst{position:absolute;width:3.6em;left:50%;top:50%;translate:-50% -50%;z-index:-1;animation:burstIn .8s var(--pop) both,spin 70s linear .8s infinite}
.home__art .tile{animation:tileIn .7s var(--pop) both;animation-delay:calc(.15s + var(--i)*.14s)}
.home__art .dot{animation:fadeIn .3s both;animation-delay:calc(.3s + var(--i)*.14s)}
.home__mascot{position:absolute;width:1.55em;right:-.9em;bottom:-.35em;transform:rotate(9deg);animation:popIn .7s var(--pop) .75s both}
.home__popper{position:absolute;width:1.15em;left:-.55em;top:-.05em;animation:popIn .7s var(--pop) .9s both}
.home__title{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,6.6vw,5.6rem);line-height:1.04;letter-spacing:-.02em;margin:.1em 0 .3em}
.home__title .w{display:inline-block;white-space:nowrap}
.home__title .ch{display:inline-block;animation:chIn .55s var(--pop) both;animation-delay:calc(.45s + var(--d)*.035s)}
.home__title .hl{color:var(--fuchsia);text-shadow:.05em .05em 0 var(--ink)}
.home__sub{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;font-size:clamp(1.05rem,2.2vw,1.5rem);margin:0 0 2.2rem;animation:fadeUp .6s ease 1s both}
.home__actions{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;animation:fadeUp .6s ease 1.15s both}
.home__links{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:1.1rem;animation:fadeUp .6s ease 1.25s both}
.home__caption{margin:1.7rem 0 0;font-weight:800;color:var(--ink-60);letter-spacing:.02em;animation:fadeUp .6s ease 1.35s both}
.home__caption b{color:var(--ink)}

/* =========================================================
   4. ВЕРХНЯЯ ПАНЕЛЬ
   ========================================================= */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,248,238,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:var(--bw) solid var(--ink)}
.topbar__inner{max-width:1800px;margin:0 auto;padding:.55rem clamp(.75rem,2vw,1.5rem);display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.3rem}
.topbar__logo{font-family:var(--display);font-weight:900;font-size:1.05rem;white-space:nowrap;line-height:1.1}
.topbar__logo span{color:var(--fuchsia)}
.topbar__progress{flex:1 1 15rem;min-width:0}
.topbar__label{font-family:var(--display);font-weight:700;font-size:.95rem;margin-bottom:.3rem;white-space:nowrap}
.topbar__label b{font-weight:900;color:var(--fuchsia)}
.segs{display:flex;gap:.3rem;align-items:center}
.seg{flex:1;min-width:0;height:.8rem;padding:0;border:2px solid var(--ink);border-radius:999px;background:transparent;cursor:pointer;transition:transform .15s,height .2s}
button.seg:hover{transform:scaleY(1.35)}
.seg--future{opacity:.22;cursor:default}
.seg--open{background:var(--sun)}
.seg--done{background:var(--teal)}
.seg--current{background:var(--fuchsia);height:1.05rem;box-shadow:2px 2px 0 var(--ink)}
.topbar__nav{display:flex;gap:.45rem;margin-left:auto}
.nav-btn{display:inline-flex;align-items:center;gap:.45em;height:2.9rem;padding:0 .78rem;border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--paper);font-family:var(--display);font-weight:700;font-size:.8rem;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s,background-color .15s;white-space:nowrap}
.nav-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--sun)}
.nav-btn:active{transform:translate(2px,2px);box-shadow:none}
.nav-btn[aria-pressed="false"]{background:#ECE6F5}
.nav-btn__txt{display:none}
@media (min-width:1600px){.nav-btn__txt{display:inline}}
@media (max-width:640px){
  .topbar__logo{display:none}
  .topbar__progress{order:3;flex-basis:100%}
  .topbar__nav{margin-left:0;width:100%;justify-content:space-between}
  .nav-btn{flex:1;justify-content:center;padding:0}
}

/* =========================================================
   5. ИГРОВОЙ ЭКРАН
   ========================================================= */
.game__main{position:relative;max-width:1800px;margin:0 auto;padding:clamp(1rem,2.5vw,2rem) clamp(.75rem,2vw,1.5rem) 4rem}
.game__grid{position:relative;z-index:1;display:grid;gap:clamp(1.25rem,2.5vw,2.5rem);align-items:start}
.game__right{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (min-width:1024px){
  .game__grid{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
  .game__left{position:sticky;top:6.4rem}
}
.past{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1.2rem;padding:.75rem 1rem;background:var(--sun);border:var(--bw) solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh-sm);font-weight:700;font-size:1.05rem}
.past:empty{display:none}

/* Карточка раунда */
.round-card{
  position:relative;overflow:hidden;isolation:isolate;container-type:inline-size;
  background:var(--bg);color:var(--fg);border:4px solid var(--ink);border-radius:clamp(22px,3vw,40px);
  box-shadow:var(--sh-lg);padding:clamp(1.1rem,2.6vw,2.2rem);
}
.round-card__burst{position:absolute;z-index:-1;width:92%;left:50%;top:44%;translate:-50% -50%;opacity:.3;animation:spin 80s linear infinite}
.round-card__spark{position:absolute;z-index:-1;width:clamp(1.6rem,5cqi,3rem)}
.round-card__top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.round-pill{background:var(--ink);color:var(--sun);font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:.45em 1.05em;border-radius:999px;font-size:clamp(.9rem,1.4vw,1.15rem)}
.topic-sticker{display:grid;place-items:center;width:clamp(3rem,7cqi,4.8rem);aspect-ratio:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:50%;box-shadow:var(--sh-sm);transform:rotate(-10deg)}
.topic-sticker .ico{width:55%;height:55%;stroke-width:2}
.abbr{display:flex;justify-content:center;align-items:center;gap:.08em;padding:.32em 0 .34em;font-size:clamp(3.2rem,10vw,9rem);font-size:min(calc(54cqi / var(--n)),25vh,12rem)}
.round-card__topic{text-align:center;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(1.15rem,3.7cqi,2.2rem);line-height:1.15}
.topic-label{display:inline-block;background:var(--ink);color:var(--paper);padding:.18em .55em;border-radius:.4em;margin-right:.35em;font-size:.72em;vertical-align:.14em;letter-spacing:.05em}
.round-card__task{position:relative;max-width:40em;margin:1.2rem auto 0;padding:.85em 1.15em;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh-sm);font-size:clamp(1.05rem,2.7cqi,1.5rem);font-weight:700;line-height:1.35;text-align:center}
.round-card__task::before{content:"";position:absolute;left:50%;top:-14px;width:22px;height:22px;background:var(--paper);border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.reveal .round-card__burst{animation:burstIn .7s var(--pop) both,spin 80s linear .7s infinite}
.reveal .tile{animation:tileIn .6s var(--pop) both;animation-delay:calc(.2s + var(--i)*.13s)}
.reveal .dot{animation:fadeIn .3s both;animation-delay:calc(.3s + var(--i)*.13s)}
.reveal .round-card__topic{animation:fadeUp .5s ease both;animation-delay:calc(.45s + var(--n)*.13s)}
.reveal .round-card__task{animation:fadeUp .5s ease both;animation-delay:calc(.75s + var(--n)*.13s)}

/* Ответы */
.answers-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.answers-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,2.4vw,2rem)}
.count{font-family:var(--display);font-weight:800;font-size:1rem;background:var(--ink);color:var(--sun);border-radius:999px;padding:.12em .7em}
.answer-form{display:flex;flex-wrap:wrap;gap:.75rem;padding:.8rem}
.answer-form .input{flex:1 1 16rem}
.answer-form .btn{flex:0 0 auto}
.hint{margin:0;font-weight:700;color:var(--ink-60);font-size:1.02rem}
.hint:empty{display:none}
.hint b{color:var(--ink)}
.answers{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.answer{
  position:relative;display:flex;align-items:flex-start;gap:.8rem;padding:.8rem;
  background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh);
  transition:opacity .3s,filter .3s,transform .25s var(--pop),background-color .25s,box-shadow .25s;
}
.answer:not(.is-dimmed):not(.is-editing):hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.answer.is-new{animation:cardIn .55s var(--pop) both}
.answer.is-selected{background:var(--sun);border-width:4px;box-shadow:var(--sh-lg);transform:scale(1.015)}
.answer.is-selected:hover{transform:scale(1.015) translate(-2px,-2px)!important}
.answer.is-dimmed{opacity:.48;filter:saturate(.35)}
.answer.is-dimmed:hover{opacity:.8}
.answer__num{flex:none;display:grid;place-items:center;width:2.6em;height:2.6em;border:3px solid var(--ink);border-radius:14px;background:var(--c);font-family:var(--display);font-weight:900;font-size:1.05rem}
.answer__body{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;padding:.15rem .1rem;text-align:left;background:none;border:0;border-radius:12px;cursor:pointer}
.answer__text{display:block;font-size:clamp(1.2rem,1.9vw,1.75rem);font-weight:800;line-height:1.25;overflow-wrap:anywhere;word-break:break-word}
.answer__tools{flex:none;display:flex;flex-direction:column;gap:.45rem}
.answer__confirm{display:flex;flex-direction:column;gap:.35rem;text-align:center;font-weight:800;font-size:.88rem}
.answer__badge{position:absolute;top:-1rem;right:4.3rem;display:flex;align-items:center;gap:.3em;padding:.18em .75em;background:var(--fuchsia);color:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:var(--sh-sm);font-family:var(--display);font-weight:800;font-size:.85rem;transform:rotate(4deg);animation:stamp .45s var(--pop) both}
.answer__edit{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6rem}
.answer__edit textarea{min-height:5.5rem;font-size:1.2rem}
.answer__edit-actions{display:flex;flex-wrap:wrap;gap:.6rem}
.answers__empty{display:flex;align-items:center;gap:1.1rem;padding:1.2rem 1.4rem;border:3px dashed rgba(41,36,58,.35);border-radius:var(--r-md);font-size:1.1rem;font-weight:600}
.answers__empty .mascot{width:4.2rem;flex:none}

/* Победитель */
.winner{
  position:relative;overflow:hidden;isolation:isolate;scroll-margin-top:7rem;
  background:var(--violet);color:var(--milk);border:4px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--sh-lg);
  padding:clamp(1.2rem,2.4vw,1.9rem) clamp(1rem,2.4vw,1.9rem);text-align:center;animation:winnerIn .55s var(--pop) both;
}
.winner--saved{background:var(--teal);color:var(--ink)}
.winner__rays{position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.1) 0deg 9deg,transparent 9deg 18deg);animation:spin 50s linear infinite}
.winner__title{display:inline-block;margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.9rem,4vw,3.3rem);line-height:1.05;color:var(--sun);text-shadow:.055em .055em 0 var(--ink);transform:rotate(-2deg);animation:stamp .6s var(--pop) .1s both}
.winner--saved .winner__title{color:var(--paper)}
.winner__answer{margin:.8rem auto 1.1rem;max-width:30em;padding:.8em 1em;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh-sm);font-size:clamp(1.25rem,2.2vw,1.9rem);font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.winner__ask{display:block;margin-bottom:.65rem;font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,1.8vw,1.4rem)}
.winner__row{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem}
.winner__row .input{flex:1 1 13rem;max-width:24rem}
.winner__note{margin:.85rem 0 0;font-size:.95rem;font-weight:600;opacity:.95}
.winner__author{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4em;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,2.4vw,2rem)}
.winner__author .ico{width:1.1em;height:1.1em}
.winner__saved{display:inline-flex;align-items:center;gap:.5em;margin:.75rem 0 1.1rem;padding:.35em 1em;background:var(--paper);border:3px solid var(--ink);border-radius:999px;font-weight:800;animation:stamp .5s var(--pop) .15s both}
.winner__saved .ico{color:#1c9a97;stroke-width:3}
.winner__actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.7rem}
.winner .popper{position:absolute;z-index:-1;bottom:.4rem;width:clamp(3.4rem,7vw,5.4rem)}
.winner .popper--l{left:.4rem;animation:popL .7s var(--pop) both}
.winner .popper--r{right:.4rem;animation:popR .7s var(--pop) both}
@media (max-width:560px){.winner .popper{opacity:.45}}

/* =========================================================
   6. МОДАЛЬНЫЕ ОКНА
   ========================================================= */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1rem}
.modal__backdrop{position:absolute;inset:0;background:rgba(41,36,58,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .2s both}
.modal__panel{position:relative;width:100%;max-width:var(--mw,40rem);max-height:calc(100dvh - 2rem);overflow:auto;overscroll-behavior:contain;background:var(--milk);border:4px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:clamp(1.2rem,3vw,2.2rem);animation:modalIn .35s var(--pop) both}
.modal__panel:focus{outline:none}
.modal.is-closing .modal__panel{animation:modalOut .18s ease both}
.modal.is-closing .modal__backdrop{animation:fadeOut .18s both}
.modal__head{display:flex;align-items:center;gap:.85rem;margin-bottom:1.2rem}
.modal__head h2{flex:1;margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.35rem,3vw,2.1rem);line-height:1.1}
.modal__icon{flex:none;display:grid;place-items:center;width:3rem;height:3rem;border:3px solid var(--ink);border-radius:50%;background:var(--sun);box-shadow:var(--sh-sm)}
.modal__foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.7rem;margin-top:1.5rem}
.confirm-text{margin:0;font-size:1.12rem;font-weight:600;line-height:1.5}
.field-label{display:block;margin-bottom:.5rem;font-weight:800;color:var(--ink-60)}
.rules-text{margin:0;font-size:clamp(1.1rem,1.8vw,1.35rem);font-weight:600;line-height:1.6}
.rules-steps{display:grid;gap:.7rem;margin:1.3rem 0 0;padding:0;list-style:none;counter-reset:s}
.rules-steps li{display:flex;align-items:center;gap:.8rem;font-weight:700;font-size:1.05rem}
.rules-steps li::before{counter-increment:s;content:counter(s);flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;border:3px solid var(--ink);border-radius:50%;background:var(--c);font-family:var(--display);font-weight:900;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:1.3rem}
.tab{display:inline-flex;align-items:center;gap:.45em;padding:.5em 1.05em;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--paper);font-family:var(--display);font-weight:700;font-size:.85rem;cursor:pointer;box-shadow:var(--sh-sm)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sun);box-shadow:none}

/* Таблица лидеров */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}
.lb__head,.lb__row{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 5.2rem;gap:.9rem;align-items:center}
.lb__head{padding:0 1rem;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-60)}
.lb__head span:last-child{text-align:right}
.lb__row{padding:.65rem 1rem;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh-sm)}
.lb__row--1{background:#FFE7A8}
.lb__row--2{background:#D9F4F3}
.lb__row--3{background:#FFE0DC}
.lb__rank{display:grid;place-items:center}
.lb__rank .medal{width:2.6rem}
.rank-num{font-family:var(--display);font-weight:900;font-size:1.3rem}
.lb__name{display:block;font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,1.8vw,1.4rem);line-height:1.2;overflow-wrap:anywhere}
.lb__wins{display:block;margin-top:.15rem;font-size:.88rem;font-weight:700;color:var(--ink-60)}
.lb__pts{position:relative;text-align:right;font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,2.5vw,2.1rem);line-height:1}
.lb__pts small{display:block;font-family:var(--sans);font-size:.4em;font-weight:800;color:var(--ink-60)}
.lb__pts.bump .num{display:inline-block;animation:bump .7s var(--pop)}
.plus{position:absolute;right:-.3rem;top:-1.1rem;padding:.1em .45em;background:var(--fuchsia);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.45em;animation:plusUp 1.8s ease forwards}
.lb__rule{margin:1rem 0 0;font-size:.92rem;font-weight:600;color:var(--ink-60)}
.lb__tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;margin-top:1rem}
.empty{display:flex;align-items:center;gap:1rem;padding:1.3rem;border:3px dashed rgba(41,36,58,.35);border-radius:var(--r-md);font-weight:700;font-size:1.08rem}
.empty .mascot{width:4.4rem;flex:none}

/* История */
.hist{list-style:none;margin:0;padding:0;display:grid;gap:.9rem}
.hist__item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;padding:.9rem;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh-sm)}
.hist__abbr{align-self:start;min-width:5.6rem;padding:.55em .6em;background:var(--bg);color:var(--fg);border:3px solid var(--ink);border-radius:14px;font-family:var(--display);font-weight:900;font-size:1.05rem;text-align:center;line-height:1.1}
.hist__abbr small{display:block;font-size:.62rem;font-weight:700;opacity:.9;margin-bottom:.2em;letter-spacing:.05em}
.hist__topic{font-weight:800;color:var(--ink-60);font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.hist__win{margin:.25rem 0 .2rem;font-size:1.2rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.hist__who{display:flex;align-items:center;gap:.4em;font-family:var(--display);font-weight:700;color:var(--violet)}
.hist__none{margin:.3rem 0;font-weight:700;color:var(--ink-60)}
.hist details{margin-top:.55rem}
.hist summary{cursor:pointer;font-weight:800;font-size:.95rem;width:fit-content}
.hist ol{margin:.5rem 0 0;padding-left:1.4rem;display:grid;gap:.25rem}
.hist ol li{font-weight:600;overflow-wrap:anywhere}
.hist ol li.is-win{font-weight:800}
.hist ol li.is-win::after{content:" 👑"}
.hist__actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
@media (max-width:520px){.hist__item{grid-template-columns:1fr}.hist__abbr{justify-self:start}}

/* =========================================================
   7. ФИНАЛ
   ========================================================= */
.final{position:relative;min-height:100dvh;overflow:hidden;padding:clamp(1.8rem,4vw,3.2rem) clamp(.9rem,2.5vw,2rem) 4rem}
.final__inner{position:relative;z-index:2;max-width:1500px;margin:0 auto}
.final__title{margin:0 0 .35em;text-align:center;font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,8vw,6.5rem);line-height:1;letter-spacing:-.02em}
.final__title .ch{display:inline-block;animation:chIn .55s var(--pop) both;animation-delay:calc(.1s + var(--d)*.045s)}
.final__title .w{display:inline-block;white-space:nowrap}
.final__title .hl{color:var(--coral);text-shadow:.05em .05em 0 var(--ink)}
.champ{position:relative;overflow:hidden;isolation:isolate;max-width:60rem;margin:0 auto 2rem;padding:clamp(1.3rem,3vw,2.3rem) clamp(1rem,4vw,3rem);background:var(--sun);border:4px solid var(--ink);border-radius:clamp(24px,3vw,40px);box-shadow:var(--sh-lg);text-align:center;animation:winnerIn .7s var(--pop) .4s both}
.champ .winner__rays{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.35) 0deg 9deg,transparent 9deg 18deg)}
.champ__label{display:inline-block;padding:.3em .9em;background:var(--ink);color:var(--sun);border-radius:999px;font-family:var(--display);font-weight:800;font-size:clamp(.9rem,1.6vw,1.2rem);text-transform:uppercase;letter-spacing:.06em}
.champ__names{margin:.35em 0 .15em;font-family:var(--display);font-weight:900;font-size:clamp(2rem,5.5vw,4.4rem);line-height:1.08;overflow-wrap:anywhere}
.champ__names .amp{color:var(--fuchsia)}
.champ__pts{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,2vw,1.5rem)}
.champ .mascot{position:absolute;z-index:-1;width:clamp(4rem,10vw,8rem);bottom:-.6rem}
.champ .mascot--l{left:.6rem;transform:rotate(-8deg)}
.champ .mascot--r{right:.6rem;transform:rotate(8deg)}
@media (max-width:640px){.champ .mascot{opacity:.35}}
.final__grid{display:grid;gap:1.6rem}
@media (min-width:960px){.final__grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.panel{padding:clamp(1rem,2.5vw,1.8rem)}
.panel h2{margin:0 0 1rem;font-family:var(--display);font-weight:900;font-size:clamp(1.3rem,2.3vw,1.8rem)}
.wins{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.wins li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.9rem;align-items:start;padding:.65rem .8rem;border:3px solid var(--ink);border-radius:var(--r-sm);background:#fff}
.wins .hist__abbr{min-width:5rem;font-size:.9rem;padding:.45em .5em}
.wins__text{font-weight:800;font-size:1.12rem;line-height:1.3;overflow-wrap:anywhere}
.wins__who{margin-top:.2rem;font-family:var(--display);font-weight:700;color:var(--violet);font-size:.92rem}
.wins__none{color:var(--ink-60);font-weight:700}
.final__actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.9rem;margin-top:2.2rem}

/* =========================================================
   8. СЛУЖЕБНОЕ: тосты, ошибка сохранения, конфетти
   ========================================================= */
.toasts{position:fixed;left:0;right:0;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:0 1rem;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6em;max-width:36rem;padding:.75em 1.3em;background:var(--ink);color:var(--milk);border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 rgba(41,36,58,.35);font-weight:800;font-size:1.05rem;animation:toastIn .35s var(--pop) both}
.toast--ok .ico{color:var(--sun)}
.toast--warn{background:var(--coral);color:var(--ink);border-radius:var(--r-md)}
.toast--info{background:var(--teal);color:var(--ink)}
.toast.out{animation:toastOut .25s ease both}
.save-error{position:fixed;left:0;right:0;top:0;z-index:90;display:none;align-items:center;justify-content:center;gap:.6em;padding:.6em 1em;background:var(--coral);color:var(--ink);border-bottom:3px solid var(--ink);font-weight:800;text-align:center}
.save-error.show{display:flex}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* Боковые поля с учётом вырезов экрана */
.home,.game__main,.final,.topbar__inner{padding-left:max(clamp(1rem,2vw,1.5rem),env(safe-area-inset-left,0px));padding-right:max(clamp(1rem,2vw,1.5rem),env(safe-area-inset-right,0px))}

/* Маскот */
.mascot .eyes{transform-origin:80px 104px;animation:blink 5s infinite}

/* =========================================================
   9. АНИМАЦИИ
   ========================================================= */
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 10deg))}}
@keyframes spin{to{rotate:360deg}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
@keyframes popIn{from{opacity:0;transform:scale(.2) rotate(-30deg)}}
@keyframes burstIn{from{opacity:0;transform:scale(.1) rotate(-90deg)}}
@keyframes tileIn{from{opacity:0;transform:translateY(.55em) scale(.3) rotate(-28deg)}to{opacity:1;transform:rotate(var(--tilt,0deg))}}
@keyframes chIn{from{opacity:0;transform:translateY(.45em) scale(.6) rotate(-8deg)}}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.94)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}70%{opacity:1}}
@keyframes winnerIn{from{opacity:0;transform:translateY(24px) scale(.92)}}
@keyframes modalIn{from{opacity:0;transform:translateY(34px) scale(.95)}}
@keyframes modalOut{to{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes popL{0%{opacity:0;transform:translate(-40px,30px) rotate(-40deg) scale(.4)}100%{opacity:1}}
@keyframes popR{0%{opacity:0;transform:scaleX(-1) translate(-40px,30px) rotate(-40deg) scale(.4)}100%{opacity:1;transform:scaleX(-1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--fuchsia)}100%{transform:scale(1)}}
@keyframes plusUp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .decor .d,.round-card__burst,.winner__rays,.home__burst{animation:none!important}
}
</style>

<body>
<div id="save-error" class="save-error" role="alert"></div>

<noscript><p style="padding:2rem;font-weight:700">Для игры нужно включить JavaScript в браузере.</p></noscript>

<script>
'use strict';
/* =========================================================
   ДАННЫЕ РАУНДОВ — меняйте текст, порядок или количество здесь
   ========================================================= */
const ROUNDS = [
  { letters:['К','О','Т'],     topic:'Название нового бизнеса',             task:'Придумайте название компании, которая занимается чем-то совершенно нелепым.', color:'coral',   icon:'briefcase' },
  { letters:['Б','А','М'],     topic:'Секретная организация',               task:'Расшифруйте название тайного общества с максимально странной миссией.',       color:'violet',  icon:'eye' },
  { letters:['П','А','Р'],     topic:'Новая профессия',                     task:'Придумайте профессию, которой пока не существует, но которая почему-то очень нужна человечеству.', color:'teal', icon:'tool' },
  { letters:['Ш','А','Р'],     topic:'Название элитного клуба',             task:'Представьте, что вы открываете закрытый клуб для очень необычных людей.',      color:'fuchsia', icon:'crown' },
  { letters:['С','О','К'],     topic:'Новое изобретение',                   task:'Придумайте бесполезное, но невероятно дорогое устройство.',                   color:'sun',     icon:'bulb' },
  { letters:['М','О','З'],     topic:'Название государственного министерства', task:'Какое министерство нужно срочно создать для решения абсурдной проблемы?',   color:'violet',  icon:'landmark' },
  { letters:['Т','О','П'],     topic:'Самая странная премия',               task:'Придумайте премию, которую вручают за совершенно неожиданное достижение.',     color:'coral',   icon:'trophy' },
  { letters:['Д','Р','А'],     topic:'Рекламная кампания',                  task:'Придумайте название или расшифровку для рекламной кампании, которую никто не просил запускать.', color:'fuchsia', icon:'megaphone' },
  { letters:['У','Ж','А','С'], topic:'Абсолютно бесполезный факультет',     task:'Какой факультет вы бы открыли в университете абсурдных наук?',                color:'teal',    icon:'cap' },
  { letters:['Б','А','Б','А'], topic:'Организация мечты',                   task:'Придумайте самую нелепую организацию, которая могла бы существовать в реальной жизни.', color:'sun', icon:'building' },
];
const N = ROUNDS.length;
const RULES_TEXT = 'На экране появится аббревиатура и тема задания. Придумайте самую смешную расшифровку и предложите её ведущему. Все варианты будут записаны на экране. Когда идеи закончатся, гости выберут лучший ответ. Победитель раунда получает 1 балл. Ведущий решает, когда переходить к следующему раунду.';

const C = { coral:'#FF6B61', fuchsia:'#E84393', sun:'#FFD166', teal:'#36C9C6', violet:'#7657D6', milk:'#FFF8EE', ink:'#29243A' };
const ACCENT = {
  coral:{bg:C.coral,fg:C.ink}, fuchsia:{bg:C.fuchsia,fg:C.milk}, sun:{bg:C.sun,fg:C.ink},
  teal:{bg:C.teal,fg:C.ink}, violet:{bg:C.violet,fg:C.milk},
};
const CARD_COLORS = [C.coral, C.teal, C.sun, '#B9A6F0', '#F59AC6'];
const STORAGE_KEY = 'oh-tri-bukvy:v1';

/* =========================================================
   ИКОНКИ И ИЛЛЮСТРАЦИИ (SVG)
   ========================================================= */
const svgI = (p) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  briefcase: svgI('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>'),
  eye:       svgI('<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  tool:      svgI('<path d="M14.5 3.5l6 6-3 3-6-6z"/><path d="M11.5 6.5L3.5 14.5l6 6 8-8"/><path d="M7 18l2-2"/>'),
  crown:     svgI('<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>'),
  bulb:      svgI('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'),
  landmark:  svgI('<path d="M3 21h18M4 10h16M12 3l9 5H3z"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8"/>'),
  trophy:    svgI('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>'),
  megaphone: svgI('<path d="M3 10v4h4l9 5V5L7 10z"/><path d="M19 9a4 4 0 0 1 0 6"/>'),
  cap:       svgI('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v5"/>'),
  building:  svgI('<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/>'),
  book:      svgI('<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>'),
  vol:       svgI('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>'),
  mute:      svgI('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>'),
  maximize:  svgI('<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>'),
  minimize:  svgI('<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>'),
  home:      svgI('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),
  plus:      svgI('<path d="M12 5v14M5 12h14"/>'),
  pencil:    svgI('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
  trash:     svgI('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/><path d="M10 10v6M14 10v6"/>'),
  check:     svgI('<path d="M4 12.5l5 5L20 6.5"/>'),
  x:         svgI('<path d="M6 6l12 12M18 6L6 18"/>'),
  arrow:     svgI('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  undo:      svgI('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
  list:      svgI('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  alert:     svgI('<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>'),
  help:      svgI('<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/>'),
  party:     svgI('<path d="M5.8 11.3L2 22l10.7-3.8"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01"/><path d="M22 2l-2.2.8a3 3 0 0 0-1.9 3.4c.1.6-.4 1.1-1 1.1h-.4a2.5 2.5 0 0 0-2.4 1.9L14 10"/><path d="M11 13c1.9 1.9 2.8 4.1 2 4.9s-3-.1-4.9-2-2.8-4.1-2-4.9 3 .1 4.9 2z"/>'),
};

function starburst(fill, spikes = 16, cls = '') {
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 ? 37 : 49, a = Math.PI * i / spikes - Math.PI / 2;
    pts.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1));
  }
  return `<svg viewBox="0 0 100 100" class="${cls}" aria-hidden="true"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

function leaderboard() {
  const map = new Map();
  state.rounds.forEach((r, i) => {
    if (!r.result) return;
    const key = normName(r.result.winnerName);
    let p = map.get(key);
    if (!p) { p = { key, name: cleanText(r.result.winnerName), points: 0, wins: [], last: i }; map.set(key, p); }
    p.points += 1; p.wins.push(i); p.last = i;
  });
  // При равенстве баллов выше тот, кто набрал этот счёт раньше (по номеру раунда)
  const arr = [...map.values()].sort((a, b) => b.points - a.points || a.last - b.last || a.name.localeCompare(b.name, 'ru'));
  let rank = 0;
  arr.forEach((p, i) => { if (i === 0 || p.points !== arr[i - 1].points) rank = i + 1; p.rank = rank; });
  return arr;
}

const fx = (() => {

  }

    for (let i = 0; i < count; i++) {

      parts.push({ x: x * W, y: y * H, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, g: .3 + Math.random() * .12,
        w: 7 + Math.random() * 7, h: 4 + Math.random() * 5, rot: Math.random() * 6.3, vr: (Math.random() - .5) * .35,
        tilt: Math.random() * 6.3, c: COLORS[(Math.random() * COLORS.length) | 0], round: Math.random() < .28, life: 0, ttl: 150 + Math.random() * 80 });
    }

const modalStack = [];
function openModal({ title, icon = '', body = '', width = '38rem', onClose }) {
  const wrap = document.createElement('div'), tid = 'm' + uid();
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="${tid}" tabindex="-1" style="--mw:${width}">
      <div class="modal__head">${icon ? `<span class="modal__icon" aria-hidden="true">${icon}</span>` : ''}<h2 id="${tid}">${title}</h2>
        <button class="icon-btn" type="button" data-close aria-label="Закрыть окно">${I.x}</button></div>
      <div class="modal__body">${body}</div>
    </div>`;
  const prev = document.activeElement;
  const m = { el: wrap, body: wrap.querySelector('.modal__body'), title: wrap.querySelector('h2'), closed: false, close };
  function close() {
    if (m.closed) return;
    m.closed = true;
    modalStack.splice(modalStack.indexOf(m), 1);
    wrap.classList.add('is-closing');
    setTimeout(() => wrap.remove(), 180);
    if (!modalStack.length) document.body.classList.remove('no-scroll');
    if (prev && document.contains(prev)) prev.focus({ preventScroll: true });
    onClose && onClose();
  }
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  document.body.appendChild(wrap);
  modalStack.push(m);
  document.body.classList.add('no-scroll');
  setTimeout(() => (wrap.querySelector('[data-autofocus]') || wrap.querySelector('.modal__panel')).focus({ preventScroll: true }), 40);
  return m;
}
function confirmDialog({ title, text, ok = 'Да', cancel = 'Отмена', danger = false }) {

function promptText({ title, label, value = '', ok = 'Сохранить' }) {

function leaderboardHTML(lb) {
  if (!lb.length) return `<div class="empty">${mascot(C.teal)}<div>Пока никто не набрал баллов.<br>Первый победитель появится после раунда 1.</div></div>`;
  return `<div class="lb__head" aria-hidden="true"><span>Место</span><span>Участник</span><span>Баллы</span></div>
    <ol class="lb">${lb.map(p => {
      const from = seenScores[p.key] ?? 0;
      return `<li class="lb__row ${p.rank <= 3 ? 'lb__row--' + p.rank : ''}">
        <span class="lb__rank" aria-label="${p.rank} место">${p.rank <= 3 ? medal(p.rank) : `<span class="rank-num">${p.rank}</span>`}</span>
        <span><span class="lb__name">${esc(p.name)}</span><span class="lb__wins">Выиграно раундов: ${p.wins.length}</span></span>
        <span class="lb__pts" data-key="${esc(p.key)}" data-from="${from}" data-to="${p.points}"><span class="num">${p.points}</span><small>${plural(p.points, 'балл', 'балла', 'баллов')}</small></span>
      </li>`;
    }).join('')}</ol>
    <p class="lb__rule">При равенстве баллов у участников одинаковое место; выше стоит тот, кто набрал этот счёт раньше.</p>`;
}
function animateCounts(root) {
  root.querySelectorAll('.lb__pts[data-to]').forEach(el => {
    const from = +el.dataset.from, to = +el.dataset.to, key = el.dataset.key;
    seenScores[key] = to;
    if (from >= to || reducedMotion.matches) return;
    const num = el.querySelector('.num'), t0 = performance.now(), dur = 700 + (to - from) * 120;
    num.textContent = from;
    el.classList.add('bump');
    el.insertAdjacentHTML('beforeend', `<span class="plus" aria-hidden="true">+${to - from}</span>`);
    const step = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      num.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function abbrBadge(i, withNum = true) {
  const A = ACCENT[ROUNDS[i].color];
  return `<div class="hist__abbr" style="--bg:${A.bg};--fg:${A.fg}">${withNum ? `<small>РАУНД ${i + 1}</small>` : ''}${abbrOf(i)}</div>`;
}
function historyHTML() {
  const items = [];
  for (let i = 0; i <= state.maxRound; i++) {
    const r = state.rounds[i], win = r.result && r.answers.find(a => a.id === r.result.answerId);
    const inProgress = i === state.maxRound && !r.result;
    items.push(`<li class="hist__item">
      ${abbrBadge(i)}
      <div>
        <div class="hist__topic">${esc(ROUNDS[i].topic)}</div>
        ${win ? `<div class="hist__win">«${esc(win.text)}»</div><div class="hist__who">${I.crown} ${esc(displayName(r.result.winnerName))}</div>`
              : `<div class="hist__none">${inProgress ? 'Раунд идёт — победитель ещё не выбран' : 'Победитель не записан'}</div>`}
        <details><summary>Все ответы (${r.answers.length})</summary>
          ${r.answers.length ? `<ol>${r.answers.map(a => `<li class="${win && a.id === win.id ? 'is-win' : ''}">${esc(a.text)}</li>`).join('')}</ol>` : '<p class="hist__none">Ответов не было</p>'}
        </details>
        <div class="hist__actions">
          <button type="button" class="btn btn--light btn--sm" data-action="open-round" data-round="${i}">Открыть раунд</button>
          ${r.result ? `<button type="button" class="btn btn--light btn--sm" data-action="edit-name" data-round="${i}">${I.pencil} Исправить имя</button>
          <button type="button" class="btn btn--light btn--sm" data-action="cancel-result" data-round="${i}">${I.undo} Отменить результат</button>` : ''}
        </div>
      </div></li>`);
  }
  return `<ol class="hist">${items.join('')}</ol>`;
}

function renderFinal(celebrate) {
  const lb = leaderboard(), top = lb.length ? lb[0].points : 0;
  const champs = lb.filter(p => p.points === top && top > 0);
  const cnt = { i: 0 };
  let champHTML;
  if (!champs.length) champHTML = `<span class="champ__label">Итог</span><div class="champ__names">Баллов пока нет</div>`;
  else if (champs.length === 1) champHTML = `<span class="champ__label">Победитель вечера</span><div class="champ__names">${esc(champs[0].name)}</div><div class="champ__pts">${pts(top)}</div>`;
  else champHTML = `<span class="champ__label">Ничья! Победители вечера</span>
    <div class="champ__names">${champs.map(p => esc(p.name)).join(' <span class="amp">&amp;</span> ')}</div>
    <div class="champ__pts">по ${pts(top)} у каждого</div>`;
  const wins = ROUNDS.map((R, i) => {
    const r = state.rounds[i], a = r.result && r.answers.find(x => x.id === r.result.answerId);
    return `<li>${abbrBadge(i)}<div>${a ? `<div class="wins__text">«${esc(a.text)}»</div><div class="wins__who">${esc(displayName(r.result.winnerName))}</div>` : `<div class="wins__none">Победитель не записан</div>`}</div></li>`;
  }).join('');
  app.innerHTML = `<main class="final">
    ${decorHTML('final')}
    <div class="final__inner">
      <h1 class="final__title" aria-label="Игра окончена!"><span aria-hidden="true">${animText('Игра', cnt)} <span class="hl">${animText('окончена!', cnt)}</span></span></h1>
      <section class="champ" aria-label="Победители">
        <div class="winner__rays" aria-hidden="true"></div>
        ${mascot(C.fuchsia, 'mascot--l')}${mascot(C.teal, 'mascot--r')}
        ${champHTML}
      </section>
      <div class="final__grid">
        <section class="panel card" aria-labelledby="fr-title"><h2 id="fr-title">Финальный рейтинг</h2>${leaderboardHTML(lb)}</section>
        <section class="panel card" aria-labelledby="fw-title"><h2 id="fw-title">Победившие расшифровки</h2><ol class="wins">${wins}</ol></section>
      </div>
      <div class="final__actions">
        <button type="button" class="btn btn--primary btn--lg" data-action="history">${I.list} Посмотреть все раунды</button>
        <button type="button" class="btn btn--light btn--lg" data-action="board">${I.trophy} Вернуться к таблице лидеров</button>
        <button type="button" class="btn btn--light btn--lg" data-action="back-to-game">${I.undo} К раунду ${N}</button>
        <button type="button" class="btn btn--danger btn--lg" data-action="reset">Начать заново</button>
      </div>
    </div>
  </main>`;
  animateCounts(app);
  if (celebrate) { setTimeout(() => { fx.finale(); sound.finale(); }, 350); }
}

/* Перерисовать то, что сейчас на экране, после изменения данных */
function rerender() {
  if (state.screen === 'game' && $('#answers-list')) refreshRoundParts();
  else if (state.screen === 'final') renderFinal(false);
  else if (state.screen === 'home') renderHome();
  renderBoard();
}

/* =========================================================
   ДЕЙСТВИЯ ВЕДУЩЕГО
   ========================================================= */
function startNew() {
  state = freshState(state.soundOn);
  state.started = true; state.screen = 'game';
  resetUi(); commit(); renderScreen();
}
function goToRound(i) {
  if (!(i >= 0 && i <= state.maxRound)) return;
  const sameRound = i === state.activeRound && state.screen === 'game';
  state.activeRound = i;
  resetUi();
  if (state.screen !== 'game') { state.screen = 'game'; commit(); renderScreen(); return; }
  commit();
  if (!sameRound) {
    renderRoundCard();
    const inp = $('#answer-input'); if (inp) { inp.value = ''; $('#answer-submit').disabled = true; }
    window.scrollTo({ top: 0, behavior: reducedMotion.matches ? 'auto' : 'smooth' });
  }
  refreshRoundParts();
}
function addAnswer(text) {
  text = cleanText(text);
  if (!text) return;
  const a = { id: uid(), text, createdAt: Date.now() };
  cur().answers.push(a);
  commit();
  renderAnswers(a.id);
  const li = document.querySelector(`.answer[data-id="${a.id}"]`);
  if (li) li.scrollIntoView({ block: 'nearest', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
}
function selectAnswer(id) {
  const r = cur();
  if (r.result) {
    if (r.result.answerId !== id) toast('Победитель уже записан. Чтобы выбрать другой ответ, нажмите «Отменить результат».', 'warn', 3800);
    return;
  }
  if (r.selectedId === id || !r.answers.some(a => a.id === id)) return; // повторный клик по той же карточке — без повторной анимации
  r.selectedId = id;
  ui.editingId = null; ui.deleteId = null;
  commit();
  renderWinner(); renderAnswers();
  fx.winner(); sound.fanfare();
  const w = $('#winner');
  if (w) w.scrollIntoView({ block: 'nearest', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
}
function saveWinner() {
  const r = cur(), name = cleanText(ui.nameDraft);
  // Защита от повторного начисления: результат раунда может быть только один
  if (!name || r.result || !r.selectedId || !r.answers.some(a => a.id === r.selectedId)) return;
  r.result = { answerId: r.selectedId, winnerName: name, savedAt: Date.now() };
  ui.nameDraft = '';
  commit();
  refreshRoundParts();
  renderBoard();
  toast('Баллы записаны!');
  sound.ding(); fx.small();
  const next = document.querySelector('#winner .btn--primary, #winner .btn--hot');
  if (next) next.focus({ preventScroll: true });
}
function nextRound() {
  if (state.activeRound !== state.maxRound || state.maxRound >= N - 1 || !cur().result) return;
  state.maxRound += 1;
  goToRound(state.maxRound);
  setTimeout(() => { const inp = $('#answer-input'); if (inp && window.innerWidth >= 1024) inp.focus({ preventScroll: true }); }, 50);
}
function finishGame() {
  if (state.maxRound !== N - 1 || !state.rounds[N - 1].result) return;
  state.finished = true; state.screen = 'final';
  commit(); renderScreen();
}
async function editWinnerName(i) {
  const r = state.rounds[i];
  if (!r || !r.result) return;
  const v = await promptText({ title: 'Исправить имя победителя', label: `Раунд ${i + 1} · ${abbrOf(i)}`, value: r.result.winnerName });
  if (v == null || !state.rounds[i].result) return;
  const name = cleanText(v);
  if (!name || name === r.result.winnerName) return;
  r.result.winnerName = name;
  commit(); rerender();
  toast('Имя исправлено — таблица пересчитана');
}
async function cancelResult(i) {
  const r = state.rounds[i];
  if (!r || !r.result) return;
  const ok = await confirmDialog({
    title: `Отменить результат раунда ${i + 1}?`,
    text: `Балл у участника «${esc(displayName(r.result.winnerName))}» будет снят, таблица лидеров пересчитается. Ответы останутся — можно будет выбрать победителя заново.`,
    ok: 'Отменить результат', cancel: 'Оставить', danger: true,
  });
  if (!ok || !state.rounds[i].result) return;
  r.selectedId = r.result.answerId;
  r.result = null;
  if (i === N - 1) state.finished = false;
  if (state.screen === 'final' && !state.finished) {
    if (board) board.close();
    state.activeRound = i; state.screen = 'game';
    resetUi(); commit(); renderScreen();
  } else { commit(); rerender(); }
  toast('Результат отменён, балл снят', 'info');
}
async function undoLast() {
  let best = -1, t = -1;
  state.rounds.forEach((r, i) => { if (r.result && r.result.savedAt >= t) { t = r.result.savedAt; best = i; } });
  if (best >= 0) await cancelResult(best);
}

const actions = {
  start: () => startNew(),
  continue: () => { state.screen = state.finished ? 'final' : 'game'; commit(); renderScreen(); },
  'new-game': async () => {
    if (await confirmDialog({ title: 'Начать новую игру?', text: 'Все ответы, победители и таблица лидеров текущей игры будут удалены. Это действие нельзя отменить.', ok: 'Да, начать заново', cancel: 'Нет, оставить', danger: true })) startNew();
  },
  reset: async () => {
    if (!await confirmDialog({ title: 'Начать заново?', text: 'Все результаты, ответы и таблица лидеров будут полностью удалены. Это действие нельзя отменить.', ok: 'Да, сбросить всё', cancel: 'Нет, оставить', danger: true })) return;
    if (board) board.close();
    state = freshState(state.soundOn); resetUi(); commit(); renderScreen();
    toast('Игра сброшена. Можно начинать новую!', 'info');
  },
  home: async () => {
    if (state.started && !await confirmDialog({ title: 'Выйти на главный экран?', text: 'Игра сохранится — вы сможете продолжить с этого же места.', ok: 'Выйти', cancel: 'Остаться' })) return;
    state.screen = 'home'; commit(); renderScreen();
  },
  rules: () => openRules(),
  board: () => openBoard('rating'),
  history: () => openBoard('history'),
  'board-tab': (el) => { if (board) { board.tab = el.dataset.tab; renderBoard(); } },
  sound: () => { state.soundOn = !state.soundOn; commit(); renderTopbar(); toast(state.soundOn ? 'Звук включён' : 'Звук выключен', 'info', 1600); },
  fullscreen: async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
    catch { toast('Полноэкранный режим недоступен в этом браузере', 'warn'); }
  },
  goto: (el, { round }) => goToRound(round),
  'open-round': (el, { round }) => { if (board) board.close(); goToRound(round); },
  select: (el, { id }) => selectAnswer(id),
  'clear-selection': () => { const r = cur(); if (r.result || !r.selectedId) return; r.selectedId = null; commit(); renderWinner(); renderAnswers(); },
  edit: (el, { id }) => {
    ui.editingId = id; ui.deleteId = null; renderAnswers();
    const ta = document.querySelector('[data-edit-input]');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  },
  'edit-cancel': () => { const id = ui.editingId; ui.editingId = null; renderAnswers(); focusCard(id); },
  delete: (el, { id }) => { ui.deleteId = id; ui.editingId = null; renderAnswers(); const b = document.querySelector('[data-autofocus-del]'); if (b) b.focus(); },
  'delete-no': () => { const id = ui.deleteId; ui.deleteId = null; renderAnswers(); focusCard(id); },
  'delete-yes': (el, { id }) => {
    const r = cur();
    if (r.result && r.result.answerId === id) return;
    r.answers = r.answers.filter(a => a.id !== id);
    if (r.selectedId === id) r.selectedId = null;
    ui.deleteId = null;
    commit(); renderWinner(); renderAnswers();
    toast('Ответ удалён', 'info', 1800);
  },
  next: () => nextRound(),
  finish: () => finishGame(),
  'edit-name': (el, { round }) => editWinnerName(round),
  'cancel-result': (el, { round }) => cancelResult(round),
  'undo-last': () => undoLast(),
  'back-to-game': () => { state.screen = 'game'; state.activeRound = N - 1; resetUi(); commit(); renderScreen(); },
};
function focusCard(id) { const b = id && document.querySelector(`.answer[data-id="${id}"] .answer__body`); if (b) b.focus({ preventScroll: true }); }

/* =========================================================
   СОБЫТИЯ (делегирование)
   ========================================================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  const round = el.dataset.round != null ? Number(el.dataset.round) : state.activeRound;
  fn(el, { round, id: el.dataset.id });
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.id === 'answer-form') {
    e.preventDefault();
    const inp = $('#answer-input');
    if (!cleanText(inp.value)) return;
    addAnswer(inp.value);
    inp.value = ''; $('#answer-submit').disabled = true; inp.focus({ preventScroll: true });
  } else if (f.id === 'winner-form') {
    e.preventDefault(); saveWinner();
  } else if (f.dataset.editForm) {
    e.preventDefault();
    const id = f.dataset.editForm, text = cleanText(f.querySelector('textarea').value);
    if (!text) { toast('Ответ не может быть пустым. Чтобы убрать его, нажмите «Удалить».', 'warn'); return; }
    const a = cur().answers.find(x => x.id === id);
    if (a) a.text = text;
    ui.editingId = null;
    commit(); renderAnswers(); renderWinner(); focusCard(id);
    toast('Ответ обновлён', 'ok', 1600);
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'answer-input') $('#answer-submit').disabled = !cleanText(t.value);
  else if (t.id === 'winner-name') { ui.nameDraft = t.value; $('#winner-save').disabled = !cleanText(t.value); }
});
document.addEventListener('keydown', (e) => {
  const top = modalStack[modalStack.length - 1];
  if (top) {
    if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
    if (e.key === 'Tab') { // удерживаем фокус внутри окна
      const f = [...top.el.querySelectorAll('button:not([disabled]),input,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (e.target.matches && e.target.matches('[data-edit-input]')) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
    else if (e.key === 'Escape') { e.preventDefault(); actions['edit-cancel'](); }
  } else if (e.key === 'Escape' && ui.deleteId) actions['delete-no']();
});
document.addEventListener('fullscreenchange', () => renderTopbar());

/* =========================================================
   ЗАПУСК
   ========================================================= */
renderScreen();
if (boot.issue === 'corrupt') toast('Сохранённые данные повреждены — начата новая игра. Копия старых данных сохранена.', 'warn', 6500);
else if (boot.issue === 'unavailable') commit();
else if (state.started && state.screen === 'game') toast(`Игра восстановлена · Раунд ${state.activeRound + 1}`, 'info', 3500);
else if (state.started && state.screen === 'final') toast('Игра восстановлена', 'info', 3000);
</script>
</body>
</html>
